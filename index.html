      {mode === 'title' && s[6] && (
        <StepCard num={6} title="Winner Declaration" status={s[6].status}>
          {s[6].status === 'loading' && <Dots text="Selecting winner…" />}
          {s[6].status === 'error'   && <ErrorBox msg={s[6].error} onAddKey={openKeyPanel} hasKey={!!groqKey} />}
          {s[6].status === 'done' && s[6].data && (
            <div className="winner-wrap">
              <div className="winner-banner">★ Recommended Title</div>
              <p className="winner-title">{s[6].data.title}</p>
              <p className="winner-just">{s[6].data.justification}</p>
              <div className="winner-foot">
                <CopyBtn text={s[6].data.title} />
                <button
                  className="btn-secondary"
                  style={{ fontSize:'.8rem', padding:'.3rem .8rem' }}
                  onClick={function() { setMode('journal'); setJSteps(null); setTimeout(runJournals, 0); }}
                  title="Use this title + abstract to find matching journals"
                >→ Suggest Journals</button>
              </div>
            </div>
          )}
        </StepCard>
      )}

      {/* ── Journal mode results ── */}
      {mode === 'journal' && journalSteps !== null && <hr className="div" />}

      {mode === 'journal' && journalSteps !== null && journalSteps.status === 'loading' && (
        <StepCard num={1} title="Finding Journals" status="loading">
          <Dots text={journalSteps.msg || 'Searching for matching journals…'} />
        </StepCard>
      )}
      {mode === 'journal' && journalSteps !== null && journalSteps.status === 'error' && (
        <StepCard num={1} title="Journal Search" status="error">
          <ErrorBox msg={journalSteps.error} onAddKey={openKeyPanel} hasKey={!!groqKey} />
        </StepCard>
      )}
      {mode === 'journal' && journalSteps !== null && journalSteps.status === 'done' && (
        <StepCard num={1} title="Journal Recommendations" status="done">
          <div style={{ fontSize:'.76rem', background:'#f5f2eb', border:'1px solid var(--border)', borderRadius:'7px', padding:'.45rem .75rem', marginBottom:'.5rem', color:'var(--muted)' }}>
            <strong style={{ color:'var(--ink)' }}>Based on:</strong>{' '}
            {(steps[5] && steps[5].winnerTitle) && <span style={{ display:'inline-block', background:'var(--card)', border:'1px solid var(--border)', borderRadius:'4px', padding:'.05rem .4rem', marginRight:'.3rem', marginTop:'.2rem', color:'var(--ink)' }}>📌 title</span>}
            {(kwResult && kwResult.data && ((kwResult.data.suggested || []).length > 0 || (kwResult.data.keywords || []).some(function(k){ return k.action === 'keep' || k.action === 'refine'; }))) && <span style={{ display:'inline-block', background:'var(--card)', border:'1px solid var(--border)', borderRadius:'4px', padding:'.05rem .4rem', marginRight:'.3rem', marginTop:'.2rem', color:'var(--ink)' }}>🔑 keywords</span>}
            <span style={{ display:'inline-block', background:'var(--card)', border:'1px solid var(--border)', borderRadius:'4px', padding:'.05rem .4rem', marginRight:'.3rem', marginTop:'.2rem', color:'var(--ink)' }}>📄 abstract</span>
          </div>
          {journalSteps.totalFound > 0 && (
            <div style={{ fontSize:'.76rem', color:'var(--muted)', marginBottom:'.5rem' }}>
              AI suggested {journalSteps.totalFound} journals · top {(journalSteps.data || []).length} shown · IF verified via OpenAlex
            </div>
          )}
          {journalSteps.ifFilterNote && (
            <div style={{ fontSize:'.78rem', background:'#e8f5e9', border:'1px solid #c3e6cb', borderRadius:'7px', padding:'.45rem .75rem', marginBottom:'.85rem', color:'#2d7a3a' }}>
              ✓ {journalSteps.ifFilterNote}
            </div>
          )}
          <div className="journal-list">
            {(journalSteps.data || []).map(function(j, i) {
              return <JournalCard key={i} item={j} rank={j.rank || i + 1} />;
            })}
          </div>
        </StepCard>
      )}

      {/* ── Abstract mode results ── */}
      {mode === 'abstract' && abstractResult !== null && <hr className="div" />}

      {mode === 'abstract' && abstractResult !== null && abstractResult.status === 'loading' && (
        <StepCard num={1} title="Abstract Analysis" status="loading">
          <Dots text="Scoring and improving your abstract…" />
        </StepCard>
      )}
      {mode === 'abstract' && abstractResult !== null && abstractResult.status === 'error' && (
        <StepCard num={1} title="Abstract Analysis" status="error">
          <ErrorBox msg={abstractResult.error} onAddKey={openKeyPanel} hasKey={!!groqKey} />
        </StepCard>
      )}
      {mode === 'abstract' && abstractResult !== null && abstractResult.status === 'done' && (
        <StepCard num={1} title="Abstract Feedback" status="done">
          <AbstractResult data={abstractResult.data} />
        </StepCard>
      )}

      {/* ── Conclusion mode results ── */}
      {mode === 'conclusion' && conclusionResult !== null && <hr className="div" />}
      {mode === 'conclusion' && conclusionResult !== null && conclusionResult.status === 'loading' && (
        <StepCard num={1} title="Conclusion Analysis" status="loading"><Dots text="Evaluating your conclusion…" /></StepCard>
      )}
      {mode === 'conclusion' && conclusionResult !== null && conclusionResult.status === 'error' && (
        <StepCard num={1} title="Conclusion Analysis" status="error"><ErrorBox msg={conclusionResult.error} onAddKey={openKeyPanel} hasKey={!!groqKey} /></StepCard>
      )}
      {mode === 'conclusion' && conclusionResult !== null && conclusionResult.status === 'done' && (
        <StepCard num={1} title="Conclusion Feedback" status="done"><ConclusionResult data={conclusionResult.data} /></StepCard>
      )}

      {/* ── Chapter Review results ── */}
      {mode === 'chapter' && chapterResult !== null && <hr className="div" />}
      {mode === 'chapter' && chapterResult !== null && chapterResult.status === 'loading' && (
        <StepCard num={1} title="Chapter Evaluation" status="loading">
          <Dots text={'Evaluating your ' + ((CHAPTER_FRAMEWORKS[chapterType] || {}).label || 'chapter') + '…'} />
        </StepCard>
      )}
      {mode === 'chapter' && chapterResult !== null && chapterResult.status === 'error' && (
        <StepCard num={1} title="Chapter Evaluation" status="error"><ErrorBox msg={chapterResult.error} onAddKey={openKeyPanel} hasKey={!!groqKey} /></StepCard>
      )}
      {mode === 'chapter' && chapterResult !== null && chapterResult.status === 'done' && (
        <StepCard num={1} title={(CHAPTER_FRAMEWORKS[chapterResult.chapterType] || {}).label + ' - ' + (CHAPTER_FRAMEWORKS[chapterResult.chapterType] || {}).name + ' Feedback'} status="done">
          <ChapterResult data={chapterResult.data} chapterType={chapterResult.chapterType} />
        </StepCard>
      )}

      {/* ── Research Question results ── */}
      {mode === 'research-q' && rqResult !== null && <hr className="div" />}
      {mode === 'research-q' && rqResult !== null && rqResult.status === 'loading' && (
        <StepCard num={1} title="Research Question Evaluation" status="loading"><Dots text="Evaluating against FINER criteria…" /></StepCard>
      )}
      {mode === 'research-q' && rqResult !== null && rqResult.status === 'error' && (
        <StepCard num={1} title="Research Question Evaluation" status="error"><ErrorBox msg={rqResult.error} onAddKey={openKeyPanel} hasKey={!!groqKey} /></StepCard>
      )}
      {mode === 'research-q' && rqResult !== null && rqResult.status === 'done' && (
        <StepCard num={1} title="FINER Feedback" status="done"><ResearchQResult data={rqResult.data} /></StepCard>
      )}

      {/* ── Contribution Check results ── */}
      {mode === 'contribution' && contribResult !== null && <hr className="div" />}
      {mode === 'contribution' && contribResult !== null && contribResult.status === 'loading' && (
        <StepCard num={1} title="Contribution Analysis" status="loading"><Dots text="Identifying and evaluating novelty claims…" /></StepCard>
      )}
      {mode === 'contribution' && contribResult !== null && contribResult.status === 'error' && (
        <StepCard num={1} title="Contribution Analysis" status="error"><ErrorBox msg={contribResult.error} onAddKey={openKeyPanel} hasKey={!!groqKey} /></StepCard>
      )}
      {mode === 'contribution' && contribResult !== null && contribResult.status === 'done' && (
        <StepCard num={1} title="Contribution Clarity Report" status="done"><ContributionResult data={contribResult.data} /></StepCard>
      )}

      {/* ── Keywords Optimizer results ── */}
      {mode === 'keywords' && kwResult !== null && <hr className="div" />}
      {mode === 'keywords' && kwResult !== null && kwResult.status === 'loading' && (
        <StepCard num={1} title="Keywords Analysis" status="loading"><Dots text={kwResult.msg || 'Analysing keywords…'} /></StepCard>
      )}
      {mode === 'keywords' && kwResult !== null && kwResult.status === 'error' && (
        <StepCard num={1} title="Keywords Analysis" status="error"><ErrorBox msg={kwResult.error} onAddKey={openKeyPanel} hasKey={!!groqKey} /></StepCard>
      )}
      {mode === 'keywords' && kwResult !== null && kwResult.status === 'done' && (
        <StepCard num={1} title="Keywords Report" status="done">
          <KeywordsResult data={kwResult.data} />
          <div style={{ marginTop:'1rem', paddingTop:'.8rem', borderTop:'1px solid var(--border)' }}>
            <button
              className="btn-primary"
              style={{ fontSize:'.82rem' }}
              onClick={function() { setMode('journal'); setJSteps(null); setTimeout(runJournals, 0); }}
              disabled={!abstract.trim()}
              title="Use these optimized keywords + abstract to find matching journals"
            >→ Find Matching Journals</button>
            <span style={{ fontSize:'.72rem', color:'var(--muted)', marginLeft:'.7rem' }}>Uses your optimized keywords + abstract</span>
          </div>
        </StepCard>
      )}

      {/* ── Full Paper Review results ── */}
      {mode === 'full-paper' && fullPaperResult !== null && <hr className="div" />}

      {mode === 'full-paper' && fullPaperResult !== null && fullPaperResult.status === 'segmenting' && (
        <StepCard num={1} title="Detecting Sections" status="loading">
          <Dots text="AI is identifying section headings and extracting text…" />
        </StepCard>
      )}

      {mode === 'full-paper' && fullPaperResult !== null && fullPaperResult.status === 'running' && (
        <StepCard num={1} title={'Evaluating ' + (fullPaperResult.sections || []).length + ' sections in parallel…'} status="loading">
          <Dots text="Results will appear below as each section completes" />
          {(fullPaperResult.sections || []).length > 0 && (
            <div style={{ marginTop: '1.25rem' }}>
              <FullPaperReport fpResult={fullPaperResult} paperType={paperType} />
            </div>
          )}
        </StepCard>
      )}

      {mode === 'full-paper' && fullPaperResult !== null && fullPaperResult.status === 'error' && (
        <StepCard num={1} title="Full Paper Analysis" status="error">
          <ErrorBox msg={fullPaperResult.error} onAddKey={openKeyPanel} hasKey={!!groqKey} />
        </StepCard>
      )}

      {mode === 'full-paper' && fullPaperResult !== null && fullPaperResult.status === 'done' && (
        <StepCard
          num={1}
          title={'Full Paper Report - ' + (fullPaperResult.sections || []).length + ' sections evaluated'}
          status="done"
        >
          <FullPaperReport fpResult={fullPaperResult} paperType={paperType} />
        </StepCard>
      )}

      <div ref={endRef} />

      {/* ── Footer ── */}
      <footer className="footer">
        <p style={{ fontWeight: 600, color: 'var(--ink)', marginBottom: '.25rem' }}>
          Developed by Fitsum Teshome, Ph.D.
        </p>
        <p style={{ fontSize: '.72rem', marginBottom: '.75rem', lineHeight: '1.55' }}>
          When you ask ChatGPT or any general model to suggest a title or journal, it invents answers from training data - it has no live access to citation databases, impact factors, or real publication records. TitleSmart works differently: it queries live academic databases (Semantic Scholar and OpenAlex) first, retrieves actual papers, real journal IF figures, and verified editorial scope data, then uses AI only to rank and explain - never to fabricate. Every suggestion is grounded in something that actually exists in the scholarly record.
        </p>
        <p>
          Powered by{' '}
          <a href="https://www.semanticscholar.org" target="_blank" rel="noopener noreferrer">Semantic Scholar</a>
          {' '}+{' '}
          <a href="https://openalex.org" target="_blank" rel="noopener noreferrer">OpenAlex</a>
          {' '}+{' '}
          <span style={{ fontFamily:'var(--mono)', fontSize:'.75rem', color:'var(--muted)' }}>
            Llama 3.3 70B
          </span>
        </p>
        {(Object.keys(s).length > 0 || journalSteps !== null || abstractResult !== null || conclusionResult !== null || chapterResult !== null || rqResult !== null || contribResult !== null || kwResult !== null || fullPaperResult !== null) && (
          <button className="btn-ghost" onClick={reset}>↺ Start over</button>
        )}
      </footer>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script src="js/journal-recommender.js"></script>
</body>
</html>
