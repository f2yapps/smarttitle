<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TitleSmart - Academic Title Recommender</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root {
  --bg:       #f5f2eb;
  --ink:      #0f0e0c;
  --accent:   #c4541a;
  --muted:    #6b6560;
  --border:   #ddd8cf;
  --card:     #faf9f5;
  --hi:       #fef3ec;
  --serif:    'DM Serif Display', serif;
  --sans:     'Instrument Sans', sans-serif;
  --mono:     'DM Mono', monospace;
  --r:        4px;
  --shadow:   0 1px 3px rgba(15,14,12,.08);
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Layout */
.container { max-width: 740px; margin: 0 auto; padding: 3rem 1.25rem 5rem; }

/* Header */
.header {
  text-align: center;
  margin-bottom: 2.5rem;
  padding-bottom: 2rem;
  border-bottom: 1px solid var(--border);
}
.header .eyebrow {
  font-family: var(--mono);
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--muted);
  margin: 0 0 .6rem;
}
.header h1 {
  font-family: var(--serif);
  font-size: 3rem;
  font-weight: 400;
  margin: 0 0 .35rem;
  letter-spacing: -.5px;
}
.header h1 em { font-style: normal; color: var(--accent); }
.header .tagline { color: var(--muted); font-size: .9rem; margin: 0; font-style: italic; }

/* Settings toggle */
.settings-toggle {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--sans);
  font-size: .8rem;
  padding: .3rem .75rem;
  border-radius: var(--r);
  cursor: pointer;
  transition: color .15s, border-color .15s;
  margin-bottom: .75rem;
}
.settings-toggle:hover { color: var(--ink); border-color: var(--ink); }
.settings-toggle.needs-key { border-color: var(--accent); color: var(--accent); }

/* Settings panel */
.settings-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.25rem;
  margin-bottom: 1.5rem;
  animation: fadeUp .2s ease;
}
.settings-panel .field-label {
  display: block;
  font-size: .75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  margin-bottom: .4rem;
}
.key-note { font-size: .75rem; color: var(--muted); margin-top: .5rem; font-style: italic; }

/* Compact API key settings */
.key-settings-btn {
  background: none;
  border: 1px solid transparent;
  font-family: var(--mono);
  font-size: .65rem;
  color: var(--muted);
  cursor: pointer;
  padding: .2rem .5rem;
  border-radius: var(--r);
  transition: color .15s, border-color .15s;
}
.key-settings-btn:hover { color: var(--ink); border-color: var(--border); }
.key-settings-btn.has-key { color: #0a7c38; }

.key-panel-compact {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: .85rem 1rem .75rem;
  margin-bottom: 1.25rem;
  animation: fadeUp .15s ease;
}
.key-panel-compact .kp-row { display: flex; gap: .4rem; align-items: center; }
.key-panel-compact .kp-row input {
  flex: 1;
  font-family: var(--mono);
  font-size: .8rem;
  padding: .35rem .6rem;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: #fff;
  color: var(--ink);
  outline: none;
}
.key-panel-compact .kp-row input:focus { border-color: var(--accent); }
.key-panel-compact .kp-save {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--r);
  font-family: var(--sans);
  font-size: .76rem;
  padding: .35rem .75rem;
  cursor: pointer;
  white-space: nowrap;
}
.key-panel-compact .kp-save:hover { opacity: .88; }
.key-panel-compact .kp-clear {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--r);
  font-family: var(--sans);
  font-size: .76rem;
  color: var(--muted);
  padding: .35rem .65rem;
  cursor: pointer;
}
.key-panel-compact .kp-clear:hover { color: var(--ink); border-color: var(--ink); }
.key-panel-compact .kp-toggle {
  background: none; border: none;
  font-size: .74rem; color: var(--accent); cursor: pointer;
  padding: .4rem 0 0; text-decoration: underline;
  text-decoration-style: dotted; font-family: var(--sans);
}
.key-panel-compact .kp-steps { margin-top: .65rem; font-size: .79rem; line-height: 1.55; }
.key-panel-compact .kp-steps ol { margin: .3rem 0 0; padding-left: 1.1rem; display: grid; gap: .3rem; }
.key-panel-compact .kp-steps a { color: var(--accent); }
.key-panel-compact .kp-note { font-size: .7rem; color: var(--muted); margin-top: .45rem; font-style: italic; }



/* Model picker */
.model-picker { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
.model-group {}
.model-group-label { font-family: var(--mono); font-size: .65rem; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; display: block; margin-bottom: .35rem; }
.model-group-btns { display: flex; flex-direction: column; gap: .3rem; }
.model-btn {
  background: #fff;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--sans);
  font-size: .78rem;
  padding: .32rem .7rem;
  border-radius: var(--r);
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: .4rem;
  transition: border-color .12s, color .12s, background .12s;
}
.model-btn:hover { border-color: var(--ink); color: var(--ink); }
.model-btn.active { font-weight: 600; }
.model-badge {
  font-family: var(--mono);
  font-size: .58rem;
  background: var(--hi);
  color: var(--accent);
  border: 1px solid rgba(196,84,26,.2);
  padding: .08rem .35rem;
  border-radius: 2px;
  letter-spacing: .04em;
  text-transform: uppercase;
}
@media (max-width:480px) { .model-picker { grid-template-columns: 1fr; } }

/* Inputs */
input[type="password"], textarea {
  width: 100%;
  font-family: var(--sans);
  font-size: .9rem;
  padding: .6rem .85rem;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: #fff;
  color: var(--ink);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input[type="password"]:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(196,84,26,.12);
}
textarea { height: 160px; resize: vertical; line-height: 1.7; }

/* Word count */
.word-count {
  font-family: var(--mono);
  font-size: .7rem;
  color: var(--muted);
  text-align: right;
  margin-top: .3rem;
}
.word-count.warn { color: #b87c00; }

/* Buttons */
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  background: var(--accent);
  color: #fff;
  border: none;
  font-family: var(--sans);
  font-size: .9rem;
  font-weight: 600;
  padding: .7rem 1.6rem;
  border-radius: var(--r);
  cursor: pointer;
  transition: background .15s;
  margin-top: .9rem;
}
.btn-primary:hover:not(:disabled) { background: #a83f13; }
.btn-primary:disabled { opacity: .42; cursor: not-allowed; }

.btn-ghost {
  background: none;
  border: 1px solid var(--border);
  color: var(--ink);
  font-family: var(--sans);
  font-size: .8rem;
  padding: .38rem .9rem;
  border-radius: var(--r);
  cursor: pointer;
  transition: border-color .15s;
}
.btn-ghost:hover { border-color: var(--ink); }

.btn-copy {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--mono);
  font-size: .68rem;
  padding: .25rem .65rem;
  border-radius: var(--r);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.btn-copy:hover { border-color: var(--accent); color: var(--accent); }
.btn-copy.copied { border-color: #2d7a3a; color: #2d7a3a; }

/* Step cards */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.step-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 1.5rem;
  animation: fadeUp .35s ease;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.step-head {
  display: flex;
  align-items: center;
  gap: .7rem;
  padding: .85rem 1.2rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.step-badge {
  font-family: var(--mono);
  font-size: .65rem;
  font-weight: 500;
  color: var(--accent);
  background: var(--hi);
  border: 1px solid rgba(196,84,26,.25);
  padding: .12rem .45rem;
  border-radius: 2px;
  letter-spacing: .04em;
  white-space: nowrap;
}
.step-head h2 {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 400;
  margin: 0;
  flex: 1;
}
.step-check {
  font-size: .75rem;
  color: #2d7a3a;
  font-family: var(--mono);
}
.step-body { padding: 1.2rem; }

/* Loading dots */
@keyframes blink {
  0%,80%,100% { opacity: 0; }
  40% { opacity: 1; }
}
.dots {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
}
.dots span {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--muted);
  animation: blink 1.4s infinite;
}
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
.loading-row {
  display: flex;
  align-items: center;
  gap: .7rem;
  color: var(--muted);
  font-size: .85rem;
}

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
.chip {
  font-family: var(--mono);
  font-size: .68rem;
  padding: .18rem .55rem;
  border-radius: 2px;
  background: var(--hi);
  border: 1px solid rgba(196,84,26,.2);
  color: var(--accent);
}
.chip.neutral {
  background: var(--bg);
  border-color: var(--border);
  color: var(--muted);
}

/* Section label */
.slabel {
  font-family: var(--mono);
  font-size: .67rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted);
  margin-bottom: .5rem;
}

/* Two-col grid */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
.field-item label {
  display: block;
  font-size: .7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  margin-bottom: .18rem;
}
.field-item p { margin: 0; font-size: .9rem; font-weight: 500; }

/* Papers table */
.papers-wrap { overflow-x: auto; }
.papers-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.papers-table th {
  text-align: left;
  font-family: var(--mono);
  font-size: .64rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  padding: .45rem .7rem;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.papers-table td { padding: .45rem .7rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.papers-table tr:last-child td { border-bottom: none; }
.papers-table tr.hl { background: var(--hi); }
.p-rank { font-family: var(--mono); color: var(--muted); font-size: .7rem; }
.p-year { white-space: nowrap; color: var(--muted); font-size: .78rem; }
.p-cites { font-family: var(--mono); text-align: right; white-space: nowrap; }
.p-cites.hot { color: var(--accent); font-weight: 500; }

/* Mining stats */
.stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: .85rem; margin-bottom: 1.2rem; }
.stat-box {
  text-align: center;
  padding: .7rem .5rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
}
.stat-val { font-family: var(--mono); font-size: 1.35rem; font-weight: 500; color: var(--accent); display: block; }
.stat-lbl { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pattern-box {
  font-family: var(--mono);
  font-size: .8rem;
  padding: .6rem .85rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 1.2rem;
  color: var(--ink);
  line-height: 1.5;
}
.vocab-block { margin-bottom: 1rem; }
.vocab-block h4 { font-family: var(--mono); font-size: .67rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .4rem; }

/* Abstract decomposition */
.decomp-list { display: grid; gap: .65rem; }
.decomp-row {
  display: grid;
  grid-template-columns: 145px 1fr;
  gap: .65rem;
  padding: .65rem .85rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
}
.decomp-key { font-family: var(--mono); font-size: .68rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: .1rem; }
.decomp-val { font-size: .87rem; line-height: 1.55; margin: 0; }

/* Title recommendation cards */
.title-card {
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 1.2rem;
  background: #fff;
}
.title-card:last-child { margin-bottom: 0; }
.title-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .55rem .9rem;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.title-type-badge {
  font-family: var(--mono);
  font-size: .65rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted);
}
.title-text-big {
  font-family: var(--serif);
  font-size: 1.25rem;
  font-weight: 400;
  line-height: 1.4;
  padding: .95rem 1rem;
  margin: 0;
  color: var(--ink);
  border-bottom: 1px solid var(--border);
}
.title-smart-section { padding: .95rem 1rem; }

/* SMART bars */
.smart-row {
  display: grid;
  grid-template-columns: 22px 1fr 56px;
  align-items: center;
  gap: .7rem;
  margin-bottom: .45rem;
}
.smart-row:last-of-type { margin-bottom: 0; }
.smart-dim-label { font-family: var(--mono); font-size: .72rem; font-weight: 500; color: var(--muted); text-align: right; }
.smart-track { height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; }
.smart-fill { height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }
.smart-fill.hi  { background: var(--accent); }
.smart-fill.mid { background: #e8a87c; }
.smart-fill.lo  { background: #c9bfb3; }
.smart-score-label { font-family: var(--mono); font-size: .7rem; color: var(--muted); text-align: right; }
.smart-na { font-family: var(--mono); font-size: .65rem; color: var(--muted); font-style: italic; }
.smart-total {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: .55rem;
  margin-top: .55rem;
  border-top: 1px solid var(--border);
}
.smart-total-lbl { font-family: var(--mono); font-size: .68rem; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.smart-total-num { font-family: var(--mono); font-size: 1rem; font-weight: 500; color: var(--accent); }
.fix-notes-section { padding: .7rem 1rem; border-top: 1px solid var(--border); background: #fffaf7; }
.fix-note { font-size: .77rem; color: var(--muted); margin: 0 0 .28rem; padding-left: 1rem; position: relative; line-height: 1.5; }
.fix-note:last-child { margin-bottom: 0; }
.fix-note::before { content: '↑'; position: absolute; left: 0; color: var(--accent); font-size: .7rem; }
.title-card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .5rem .9rem;
  border-top: 1px solid var(--border);
  gap: .5rem;
}
.justification-text { font-size: .8rem; color: var(--muted); line-height: 1.5; font-style: italic; flex: 1; }

/* Winner */
.winner-wrap { border: 2px solid var(--accent); border-radius: var(--r); overflow: hidden; }
.winner-banner {
  background: var(--accent);
  color: #fff;
  padding: .55rem 1rem;
  font-family: var(--mono);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .12em;
}
.winner-title {
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 400;
  line-height: 1.35;
  padding: 1.15rem;
  margin: 0;
  border-bottom: 1px solid #e8d5c4;
  background: var(--hi);
}
.winner-just { padding: .95rem 1.15rem; font-size: .87rem; line-height: 1.7; margin: 0; }
.winner-foot {
  display: flex;
  justify-content: flex-end;
  padding: .5rem 1rem;
  border-top: 1px solid #e8d5c4;
  background: var(--hi);
}

/* Alerts */
.error-box { background: #fff5f5; border: 1px solid #f5c2c2; border-radius: var(--r); padding: .7rem .9rem; font-size: .82rem; color: #8b2020; }
.error-key-hint {
  margin-top: .5rem;
  background: #fff8f0;
  border: 1px solid rgba(196,84,26,.25);
  border-radius: var(--r);
  padding: .6rem .9rem;
  font-size: .8rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  flex-wrap: wrap;
}
.error-key-hint span { color: var(--ink); line-height: 1.4; }
.error-key-hint strong { color: var(--accent); }
.error-key-hint button {
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--r); font-family: var(--sans);
  font-size: .76rem; padding: .3rem .75rem;
  cursor: pointer; white-space: nowrap;
}
.error-key-hint button:hover { opacity: .88; }
.warn-box  { background: #fffbee; border: 1px solid #f0e0a0; border-radius: var(--r); padding: .55rem .85rem; font-size: .78rem; color: #7a6000; margin-bottom: .75rem; }

/* Divider */
hr.div { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

/* Footer */
.footer { text-align: center; padding-top: 2rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .78rem; }
.footer p { margin: 0 0 .75rem; }

/* ── Mode tabs ── */
.mode-tabs { display: flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 1.75rem; flex-wrap: wrap; }
.mode-tab { flex: 1; background: none; border: none; border-right: 1px solid var(--border); font-family: var(--sans); font-size: .82rem; font-weight: 500; color: var(--muted); padding: .6rem .5rem; cursor: pointer; transition: all .15s; }
.mode-tab:last-child { border-right: none; }
.mode-tab:hover:not(.active) { background: var(--bg); color: var(--ink); }
.mode-tab.active { background: var(--accent); color: #fff; font-weight: 600; }

/* ── Journal filter options ── */
.filter-row { display: flex; gap: .45rem; margin-bottom: .9rem; flex-wrap: wrap; }
.filter-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-family: var(--sans); font-size: .78rem; padding: .3rem .75rem; border-radius: 99px; cursor: pointer; transition: all .12s; }
.filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--hi); font-weight: 600; }
.hindex-row { display: flex; align-items: center; gap: .6rem; margin-bottom: 1rem; flex-wrap: wrap; }
.hindex-row label { font-size: .8rem; color: var(--muted); white-space: nowrap; }

<script type="text/babel" data-presets="react,env">
/* =============================================================
   TitleSmart - Academic Title Recommender
   Multi-model: Groq/Meta (default), Claude, GPT-4o, Gemini
   ============================================================= */

const { useState, useEffect, useRef, useCallback } = React;

const S2_BASE = 'https://api.semanticscholar.org/graph/v1';

/* Model registry - add or remove entries here to customise */
const MODELS = [
  { id: 'llama-3.3-70b-versatile',    label: 'Llama 3.3 70B',    provider: 'groq',   badge: 'Recommended' },
  { id: 'llama-3.1-8b-instant',       label: 'Llama 3.1 8B',     provider: 'groq'   },
  { id: 'mixtral-8x7b-32768',         label: 'Mixtral 8x7B',     provider: 'groq'   },
  { id: 'claude-sonnet-4-5',          label: 'Claude Sonnet',    provider: 'claude' },
  { id: 'claude-haiku-4-5-20251001',  label: 'Claude Haiku',     provider: 'claude' },
  { id: 'gpt-4o',                     label: 'GPT-4o',           provider: 'openai' },
  { id: 'gpt-4o-mini',                label: 'GPT-4o Mini',      provider: 'openai' },
  { id: 'gemini-2.0-flash',           label: 'Gemini 2.0 Flash', provider: 'gemini' },
  { id: 'gemini-1.5-pro',             label: 'Gemini 1.5 Pro',   provider: 'gemini' },
];

const PROVIDERS = {
  groq:   { label: 'Groq / Meta', color: '#f55036', placeholder: 'gsk_…',    note: 'Get your free key at console.groq.com' },
  claude: { label: 'Anthropic',   color: '#c4541a', placeholder: 'sk-ant-…', note: 'Get your key at console.anthropic.com' },
  openai: { label: 'OpenAI',      color: '#10a37f', placeholder: 'sk-…',     note: 'Get your key at platform.openai.com' },
  gemini: { label: 'Google',      color: '#1a73e8', placeholder: 'AIza…',    note: 'Get your key at aistudio.google.com' },
};

const KEY_STEPS = {
  groq: {
    url: 'console.groq.com',
    steps: [
      'Go to console.groq.com',
      'Sign up or log in - free tier available, no credit card needed',
      'Click "API Keys" in the left sidebar',

    ],
  },
  claude: {
    url: 'console.anthropic.com',
    steps: [
      'Go to console.anthropic.com',
      'Sign up or log in',
      'Click "API Keys" in the left sidebar',
      'Click "Create Key" and give it a name',
      'Copy the key - it starts with sk-ant-',

    ],
  },
  openai: {
    url: 'platform.openai.com',
    steps: [
      'Go to platform.openai.com',
      'Sign up or log in (requires billing setup)',
      'Click your profile icon → "API keys"',
      'Click "Create new secret key"',
      'Copy the key - it starts with sk-',
      'Paste it in the field above',
    ],
  },
  gemini: {
    url: 'aistudio.google.com',
    steps: [
      'Go to aistudio.google.com',
      'Sign in with your Google account',
      'Click "Get API Key" in the top-left menu',
      'Click "Create API key in new project"',
      'Copy the key - it starts with AIza',
      'Paste it in the field above',
    ],
  },
};

const DEFAULT_MODEL = 'llama-3.3-70b-versatile';
const GROQ_FREE_MODEL = 'llama-3.3-70b-versatile';

// Module-level slot so callAI (outside React) can read the user's key.
window._groqKey = localStorage.getItem('titlesmart_groq_key') || null;
window._onRateLimit = null;

function modelProvider(modelId) {
  const m = MODELS.find(function(x) { return x.id === modelId; });
  return m ? m.provider : 'groq';
}

function _isRateLimit(status, msg) {
  if (status === 429) return true;
  var m = (msg || '').toLowerCase();
  return m.includes('rate') || m.includes('quota') || m.includes('limit exceeded') || m.includes('too many');
}

/* ─────────────────────────────────────────────────────────────
   MULTI-PROVIDER AI CALLER
   ───────────────────────────────────────────────────────────── */

// When the user has provided their own Groq key, call Groq directly (CORS supported).
// Otherwise falls back to the server-side /api/chat proxy.
async function callAI(system, user) {
  if (window._groqKey) {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + window._groqKey,
      },
      body: JSON.stringify({
        model: GROQ_FREE_MODEL,
        messages: [
          { role: 'system', content: system },
          { role: 'user',   content: user   },
        ],
      }),
    });
    if (!res.ok) {
      const d = await res.json().catch(function() { return {}; });
      const msg = (d.error && d.error.message) || ('Groq error ' + res.status);
      if (_isRateLimit(res.status, msg) && window._onRateLimit) window._onRateLimit();
      throw new Error(msg);
    }
    const d = await res.json();
    return d.choices[0].message.content;
  }

  // Server-side proxy (shared key, Groq Llama 3.3 70B).
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system, user }),
  });
  if (!res.ok) {
    const d = await res.json().catch(function() { return {}; });
    const msg = d.error || 'Server error ' + res.status;
    if (_isRateLimit(res.status, msg) && window._onRateLimit) window._onRateLimit();
    throw new Error(msg);
  }
  const d = await res.json();
  return d.text;
}

// Parses JSON from an AI response - handles markdown code fences.
function parseJson(text) {
  const t = text.trim();
  try { return JSON.parse(t); } catch(e1) {}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) { try { return JSON.parse(fence[1].trim()); } catch(e2) {} }
  const obj = t.match(/\{[\s\S]*\}/);
  if (obj) { try { return JSON.parse(obj[0]); } catch(e3) {} }
  throw new Error('Could not parse JSON. Raw response: ' + t.slice(0, 400));
}

// AI call + JSON parse with one automatic retry on malformed JSON.
async function aiJson(system, user) {
  const text = await callAI(system, user);
  try {
    return parseJson(text);
  } catch(parseErr) {
    const retry = await callAI(
      system,
      user + '\n\nIMPORTANT: Return ONLY valid JSON. No markdown. No code fences. No extra text.'
    );
    return parseJson(retry);
  }
}

// Searches Semantic Scholar and returns papers sorted by citation count.
async function fetchPapers(query, broad) {
  var q = broad ? query.split(/\s+/).slice(0, 4).join(' ') : query;
  var url = S2_BASE + '/paper/search?query=' + encodeURIComponent(q) + '&fields=title,citationCount,year,venue&limit=50';
  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, 14000);
  try {
    var res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) {
      var hint = res.status === 429 ? ' (rate-limited - wait a moment and retry)' : '';
      throw new Error('Semantic Scholar ' + res.status + hint);
    }
    var data = await res.json();
    return (data.data || [])
      .filter(function(p) { return p.title && p.citationCount != null; })
      .sort(function(a, b) { return (b.citationCount || 0) - (a.citationCount || 0); })
      .slice(0, 20);
  } catch(e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('Semantic Scholar timed out (14 s)');
    throw e;
  }
}

/* ─────────────────────────────────────────────────────────────
   CORPUS PRE-COMPUTATION (JavaScript - no AI involved)
   Computes real statistics from paper titles so the AI never
   has to count or average anything. The AI only does what it
   is actually good at: semantic judgment and classification.
   ───────────────────────────────────────────────────────────── */

// Words too generic to carry field-specific signal in titles.
var STOP_WORDS = new Set([
  'a','an','the','and','or','but','in','on','at','to','for','of','with',
  'by','from','up','about','into','through','during','this','that','these',
  'those','is','are','was','were','be','been','being','have','has','had',
  'do','does','did','will','would','could','should','may','might','shall',
  'can','as','if','then','than','so','yet','both','either','neither','nor',
  'not','only','own','same','such','too','very','just','because','until',
  'while','although','though','since','unless','however','therefore','thus',
  'among','between','each','every','all','any','few','more','most','other',
  'some','its','our','their','his','her','we','they','you','it',
  // Generic academic-title words that appear across all fields
  'study','studies','analysis','analyses','review','reviews','paper','papers',
  'using','used','use','based','new','novel','improved','better','effective',
  'approach','method','methods','system','systems','model','models',
  'propose','proposed','presents','presented','develop','developed',
  'framework','technique','techniques','algorithm','algorithms',
  'application','applications','evaluation','evaluations','assessment',
  'towards','toward','via','without','within','across','over','under',
  'two','three','four','five','first','second','third','large','small',
  'high','low','deep','multiple','single','multi','cross',
]);

function tokenizeTitle(title) {
  return title.toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/)
    .filter(function(w) { return w.length > 2 && !STOP_WORDS.has(w); });
}

function mineCorpus(papers) {
  var freq = {};
  var lengths = [];
  var colonCount = 0;
  var questionCount = 0;
  var colonSamples = [];
  var nonColonSamples = [];

  papers.forEach(function(p) {
    var title = p.title || '';
    var wordCount = title.split(/\s+/).filter(Boolean).length;
    lengths.push(wordCount);

    var hasColon = title.indexOf(':') !== -1;
    if (hasColon) {
      colonCount++;
      if (colonSamples.length < 6) colonSamples.push(title);
    } else {
      if (nonColonSamples.length < 4) nonColonSamples.push(title);
    }
    if (title.indexOf('?') !== -1) questionCount++;

    // Count word occurrences - deduplicate within each title so a single
    // paper cannot inflate a term's cross-paper frequency.
    var seenInTitle = {};
    tokenizeTitle(title).forEach(function(w) {
      if (!seenInTitle[w]) {
        freq[w] = (freq[w] || 0) + 1;
        seenInTitle[w] = true;
      }
    });
  });

  var n = papers.length || 1;
  var totalLen = lengths.reduce(function(a, b) { return a + b; }, 0);
  var avgLen = Math.round(totalLen / n);
  var minLen = Math.min.apply(null, lengths);
  var maxLen = Math.max.apply(null, lengths);

  // Sort words by cross-paper frequency, descending
  var sorted = Object.keys(freq)
    .map(function(w) { return { word: w, count: freq[w] }; })
    .sort(function(a, b) { return b.count - a.count; });

  var tier1 = sorted.filter(function(e) { return e.count >= 5; })
                    .map(function(e) { return e.word + ' (' + e.count + ')'; });
  var tier2 = sorted.filter(function(e) { return e.count >= 3 && e.count < 5; })
                    .map(function(e) { return e.word + ' (' + e.count + ')'; });
  var tier3 = sorted.filter(function(e) { return e.count === 2; })
                    .map(function(e) { return e.word; })
                    .slice(0, 30);

  // Clean labels (strip counts) for display
  var tier1Display = sorted.filter(function(e) { return e.count >= 5; })
                           .map(function(e) { return e.word; });
  var tier2Display = sorted.filter(function(e) { return e.count >= 3 && e.count < 5; })
                           .map(function(e) { return e.word; });

  return {
    n: n,
    avgLen: avgLen,
    lenRange: minLen + '–' + maxLen,
    colonCount: colonCount,
    colonPct: Math.round(colonCount / n * 100),
    questionCount: questionCount,
    colonSamples: colonSamples,
    nonColonSamples: nonColonSamples,
    tier1: tier1,           // annotated for AI prompt ("word (N)")
    tier2: tier2,
    tier3: tier3,           // plain words for AI
    tier1Display: tier1Display,   // plain words for UI
    tier2Display: tier2Display,
    tier3Display: tier3,
  };
}

async function fetchJournals(query) {
  const url = 'https://api.openalex.org/sources?search=' + encodeURIComponent(query) +
    '&filter=type:journal&per-page=25&mailto=support@f2yapps.com';
  const res = await fetch(url);
  if (!res.ok) {
    const body = await res.text().catch(function() { return ''; });
    throw new Error('OpenAlex ' + res.status + (body ? ' - ' + body.slice(0, 200) : ''));
  }
  const data = await res.json();
  var results = (data.results || []).filter(function(j) { return j.display_name; });
  results.sort(function(a, b) { return (b.cited_by_count || 0) - (a.cited_by_count || 0); });
  return results.slice(0, 25);
}

// Ask the AI for headings only - NOT section content.
// Section texts are sliced from the original paper in JS using heading positions.
// This keeps the AI response small (just heading strings) and avoids output token truncation.
function promptSegment(fullText, paperType) {
  var chapterKeys = CHAPTER_SETS[paperType] || CHAPTER_SETS['article'];
  var chapters = chapterKeys.map(function(k) {
    return (CHAPTER_FRAMEWORKS[k] || {}).label || k;
  }).join(', ');
  var keyList = chapterKeys.join(', ');
  return {
    system: 'You are an expert at parsing academic papers. Return section headings only - do NOT return any section body text. Return only valid JSON, no markdown.',
    user: 'Identify the section headings in this ' + paperType + ' paper.\n\nPAPER TYPE: ' + paperType + '\nEXPECTED SECTIONS: ' + chapters + '\n\nFULL PAPER:\n"""\n' + fullText.slice(0, 28000) + '\n"""\n\nFor each section found, return the exact heading string exactly as it appears in the paper (including any prefix like "1.", "##", "ABSTRACT", "Methods" etc.). Map it to the correct key. Omit sections not present.\n\nReturn headings ONLY - no body text at all.\n\nReturn JSON exactly:\n{\n  "sections": [\n    {\n      "key": "<one of: ' + keyList + '>",\n      "heading": "<exact heading string as it appears in the paper>"\n    }\n  ],\n  "notes": "<note on missing sections or unusual structure, or null>"\n}',
  };
}

// Extract section texts in JS by finding each heading in the original text and slicing between headings.
function extractSectionTexts(fullText, headings) {
  var positioned = [];
  headings.forEach(function(h) {
    if (!h.heading) return;
    var idx = fullText.indexOf(h.heading);
    if (idx === -1) {
      var lower = fullText.toLowerCase();
      idx = lower.indexOf(h.heading.toLowerCase());
    }
    if (idx !== -1) {
      positioned.push({ key: h.key, heading: h.heading, pos: idx });
    }
  });

  positioned.sort(function(a, b) { return a.pos - b.pos; });

  // Remove duplicate positions
  var seen = {};
  positioned = positioned.filter(function(h) {
    if (seen[h.pos]) return false;
    seen[h.pos] = true;
    return true;
  });

  var sections = [];
  for (var i = 0; i < positioned.length; i++) {
    var contentStart = positioned[i].pos + positioned[i].heading.length;
    var contentEnd = i + 1 < positioned.length ? positioned[i + 1].pos : fullText.length;
    var text = fullText.slice(contentStart, contentEnd).trim();
    if (text.length > 30) {
      sections.push({ key: positioned[i].key, heading: positioned[i].heading, text: text });
    }
  }
  return sections;
}

function SmartBar({ dim, score }) {
  if (score === null || score === undefined) {
    return (
      <div className="smart-row">
        <span className="smart-dim-label">{dim}</span>
        <div className="smart-track" />
        <span className="smart-score-label smart-na">N/A</span>
      </div>
    );
  }
  const pct = Math.round((score / 20) * 100);
  const cls = score >= 15 ? 'hi' : score >= 10 ? 'mid' : 'lo';
  return (
    <div className="smart-row">
      <span className="smart-dim-label">{dim}</span>

        <div className={`smart-fill ${cls}`} style={{ width: `${pct}%` }} />

      <span className="smart-score-label">{score}/20</span>
    </div>
  );
}

// Copy-to-clipboard button with 2-second feedback.
function CopyBtn({ text }) {
  const [ok, setOk] = useState(false);
  const copy = () => {
    navigator.clipboard.writeText(text).then(() => {
      setOk(true);
      setTimeout(() => setOk(false), 2000);
    });
  };
  return (
    <button className={`btn-copy${ok ? ' copied' : ''}`} onClick={copy} aria-label="Copy title to clipboard">
      {ok ? 'Copied!' : 'Copy title'}
    </button>
  );
}

function MiningDisplay({ data, relevance, papers }) {
  const corpus = data || {};
  const rel5 = ((relevance && relevance.relevant_5) || [])
    .map(function(i) { return papers && papers[i - 1]; })
    .filter(Boolean);
  const structure = (relevance && relevance.dominant_structure) || '-';
  const poolSize = (corpus.tier1Display || []).length + (corpus.tier2Display || []).length;
  const tiers = [
    { key: 'tier1Display', lbl: 'Tier 1 - appears in 5+ titles (highest priority)' },
    { key: 'tier2Display', lbl: 'Tier 2 - appears in 3–4 titles' },
    { key: 'tier3Display', lbl: 'Tier 3 - appears in 2 titles' },
  ];
  return (
    <>
      <div className="stats-row">
        <div className="stat-box">
          <span className="stat-val">{corpus.avgLen || '-'}</span>
          <span className="stat-lbl">Avg words</span>
        </div>
        <div className="stat-box">
          <span className="stat-val">{corpus.colonCount || 0}/{corpus.n || '?'}</span>
          <span className="stat-lbl">Use colons</span>
        </div>
        <div className="stat-box">
          <span className="stat-val">{poolSize}</span>
          <span className="stat-lbl">Pool terms</span>
        </div>
      </div>
      <div className="warn-box" style={{ marginBottom:'.85rem', fontSize:'.75rem' }}>
        Word counts are exact - computed from the {corpus.n || '?'} retrieved titles, not estimated.
        Title length range: {corpus.lenRange || '-'} words.
        {corpus.questionCount > 0 && ' ' + corpus.questionCount + ' titles use question form.'}
      </div>

      <div className="slabel">Dominant title structure (AI-classified)</div>
      <div className="pattern-box">{structure}</div>

      {tiers.filter(function(t) { return (corpus[t.key] || []).length > 0; }).map(function(t) {
        return (
          <div key={t.key} className="vocab-block">
            <h4>{t.lbl}</h4>
            <div className="chips">
              {(corpus[t.key] || []).map(function(w) {
                return <span key={w} className="chip">{w}</span>;
              })}
            </div>
          </div>
        );
      })}

      {rel5.length > 0 && (
        <>
          <div className="slabel" style={{ marginTop:'1rem' }}>5 most relevant to your abstract (AI-selected)</div>
          <div style={{ display:'grid', gap:'.4rem' }}>
            {rel5.map(function(p, i) {
              return (
                <div key={i} style={{ fontSize:'.82rem', padding:'.45rem .75rem', background:'var(--hi)', border:'1px solid rgba(196,84,26,.18)', borderRadius:'var(--r)', lineHeight:1.5 }}>
                  <span style={{ fontWeight:500 }}>{p.title}</span>
                  <span style={{ fontFamily:'var(--mono)', fontSize:'.65rem', color:'var(--muted)', marginLeft:'.55rem' }}>
                    {p.year || 'n.d.'}{p.venue ? ' · ' + p.venue : ''} · {(p.citationCount || 0).toLocaleString()} cites
                  </span>
                </div>
              );
            })}
          </div>
        </>
      )}
    </>
  );
}

function DecompDisplay({ data }) {

// Single title recommendation card with SMART bars, fix notes, and justification.
function TitleCard({ item, isWinner }) {
  const sc = item.scores || {};
  const fn = item.fix_notes || {};
  const total = item.total ?? Object.values(sc).reduce((a, v) => a + (v || 0), 0);
  const fixes = Object.entries(fn).filter(([dim, note]) => note && (sc[dim] ?? 20) < 15);

  return (
    <div className={`title-card${isWinner ? ' winner-wrap' : ''}`}>
      <div className="title-card-top">
        <span className="title-type-badge">{item.type}</span>
        <CopyBtn text={item.title} />
      </div>
      <p className="title-text-big">{item.title}</p>
      <div className="title-smart-section">
        {['S','M','A','R','T'].map(d => (
          <SmartBar key={d} dim={d} score={sc[d] !== undefined ? sc[d] : null} />
        ))}
        <div className="smart-total">
          <span className="smart-total-lbl">Total SMART</span>
          <span className="smart-total-num">{total}/100</span>
        </div>
      </div>
      {fixes.length > 0 && (
        <div className="fix-notes-section">
          <div className="slabel" style={{ marginBottom:'.35rem' }}>Improvement notes</div>
          {fixes.map(([dim, note]) => (
            <p key={dim} className="fix-note"><strong>{dim}:</strong> {note}</p>
          ))}
        </div>
      )}
      {item.justification && (
        <div className="title-card-foot">
          <span className="justification-text">{item.justification}</span>
        </div>
      )}
    </div>
  );
}

function JournalCard({ item, rank }) {
  const ifTier = item.if_tier || '';
  const ifTierClass = ifTier === 'High' ? 'tier-stretch' : ifTier === 'Strong' ? 'tier-good' : ifTier === 'Good' ? 'tier-safe' : 'tier-safe';
  const accessClass = item.access_type === 'open-access' ? 'badge-oa' : item.access_type === 'hybrid' ? 'badge-hybrid' : 'badge-sub';
  const accessLabel = item.access_type === 'open-access' ? 'Open Access' : item.access_type === 'hybrid' ? 'Hybrid' : 'Subscription';
  const riskColor = item.rejection_risk === 'low' ? '#2d7a3a' : item.rejection_risk === 'high' ? '#c0392b' : '#b06000';
  const riskBg   = item.rejection_risk === 'low' ? '#e8f5e9' : item.rejection_risk === 'high' ? '#fff0f0' : '#fff8e1';
  const fits = [
    { lbl: 'Topic fit',  val: item.topic_fit  || 0 },
    { lbl: 'Method fit', val: item.method_fit || 0 },
    { lbl: 'Scope fit',  val: item.scope_fit  || 0 },
  ];
  const avgFit = Math.round(((item.topic_fit || 0) + (item.method_fit || 0) + (item.scope_fit || 0)) / 3);
  return (
    <div className="journal-card">
      <div className="journal-card-head">
        <div>
          <p className="journal-name">#{rank} {item.name}</p>
          <p className="journal-publisher">{item.publisher || ''}</p>
        </div>
        <div className="journal-badges">
          <span className={'badge ' + accessClass}>{accessLabel}</span>
          {ifTier && <span className={'badge ' + ifTierClass}>{ifTier} IF</span>}
        </div>
      </div>
      <div className="journal-body">
        <div className="journal-meta" style={{ gridTemplateColumns:'repeat(4,1fr)' }}>
          <div className="jmeta">
            <span className="jmeta-val">
              {item.impact_factor ? item.impact_factor.toFixed(2) : 'N/A'}
              {item.if_verified && <span title="Verified from OpenAlex" style={{ fontSize:'.6rem', marginLeft:'.25rem', color:'#2d7a3a', fontWeight:700 }}>✓</span>}
            </span>
            <span className="jmeta-lbl">Impact Factor{item.if_verified ? ' (verified)' : ''}</span>
          </div>
          <div className="jmeta">
            <span className="jmeta-val">{item.apc_usd ? '$' + item.apc_usd.toLocaleString() : '-'}</span>
            <span className="jmeta-lbl">APC (USD)</span>
          </div>
          <div className="jmeta">
            <span className="jmeta-val">{avgFit}%</span>
            <span className="jmeta-lbl">Avg Fit</span>
          </div>
          <div className="jmeta">
            <span className="jmeta-val" style={{ textTransform:'capitalize', color: riskColor }}>{item.rejection_risk || '-'}</span>
            <span className="jmeta-lbl">Desk-Rejection Risk</span>
          </div>
        </div>
        {fits.map(function(f) {
          const fillColor = f.val >= 70 ? 'var(--accent)' : f.val >= 50 ? '#e8a87c' : '#c9bfb3';
          return (
            <div key={f.lbl} className="fit-row">
              <span className="fit-lbl">{f.lbl}</span>
              <div className="fit-track">
                <div className="fit-fill" style={{ width: f.val + '%', background: fillColor }} />
              </div>
              <span className="fit-pct">{f.val}%</span>
            </div>
          );
        })}
        {item.rejection_risk_note && (
          <p style={{ fontSize:'.78rem', margin:'.55rem 0 .1rem', padding:'.4rem .65rem', borderRadius:'6px', background: riskBg, color: riskColor, fontStyle:'italic' }}>
            ⚠ {item.rejection_risk_note}
          </p>
        )}
        {item.why && <p className="journal-why">{item.why}</p>}
        {item.rationale && !item.why && <p className="journal-why">{item.rationale}</p>}

        {/* Score bar */}
        {item.score != null && (
          <div style={{ margin:'.6rem 0 .3rem' }}>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:'.7rem', color:'var(--muted)', marginBottom:'.2rem' }}>
              <span>Scope match</span>
              <span style={{ fontWeight:700, color: item.score >= 0.75 ? '#2d7a3a' : item.score >= 0.5 ? '#b07a2a' : '#7a3a2d' }}>{Math.round(item.score * 100)}%</span>
            </div>
            <div style={{ height:'6px', borderRadius:'4px', background:'var(--border)', overflow:'hidden' }}>
              <div style={{ height:'100%', borderRadius:'4px', width: Math.round(item.score * 100) + '%', background: item.score >= 0.75 ? 'var(--accent)' : item.score >= 0.5 ? '#e8a87c' : '#c9bfb3', transition:'width .4s' }} />
            </div>
          </div>
        )}

        {/* Fit tags */}
        {item.fit_tags && item.fit_tags.length > 0 && (
          <div style={{ display:'flex', flexWrap:'wrap', gap:'.3rem', margin:'.4rem 0' }}>
            {item.fit_tags.map(function(t, i) {
              return <span key={i} style={{ fontSize:'.67rem', background:'#e8f5e9', border:'1px solid #c3e6cb', borderRadius:'12px', padding:'.1rem .5rem', color:'#1a5c2a', fontWeight:600 }}>{t}</span>;
            })}
          </div>
        )}

        <div style={{ marginTop:'.65rem', display:'flex', gap:'.6rem', flexWrap:'wrap' }}>
          {(item.submission_url || item.homepage_url) && (
            <a href={item.submission_url || item.homepage_url} target="_blank" rel="noopener noreferrer"
              style={{ fontSize:'.75rem', fontWeight:700, color:'#fff', textDecoration:'none', padding:'.28rem .75rem', borderRadius:'6px', background:'var(--accent)' }}>
              Submit here →
            </a>
          )}
          {item.open_access && (
            <span style={{ fontSize:'.72rem', fontWeight:700, color:'#1a5c2a', background:'#e8f5e9', border:'1px solid #c3e6cb', borderRadius:'6px', padding:'.2rem .55rem' }}>⊕ Open Access</span>
          )}
          {item.openalex_url && (
            <a href={item.openalex_url} target="_blank" rel="noopener noreferrer"
              style={{ fontSize:'.72rem', color:'var(--muted)', textDecoration:'none', padding:'.2rem .55rem', border:'1px solid var(--border)', borderRadius:'6px' }}>
              OpenAlex
            </a>
          )}
        </div>
      </div>
    </div>
  );
}

function WritingFeedback({ items, dimMap }) {
  if (!items || items.length === 0) return null;
  const actionStyle = function(action) {
    if (action === 'add')    return { label:'+ Add',     color:'#2d7a3a', bg:'#e8f5e9', border:'#c3e6cb' };
    if (action === 'remove') return { label:'− Remove',  color:'#c0392b', bg:'#fff0f0', border:'#f5c6c6' };
    return                          { label:'↑ Improve', color:'var(--accent)', bg:'var(--hi)', border:'rgba(196,84,26,.25)' };
  };
  return (
    <>
      <div className="slabel">Author feedback</div>
      <div className="improvement-list">
        {items.map(function(fb, i) {
          const s = actionStyle(fb.action);
          return (
            <div key={i} className="improvement-item">
              <div className="improvement-head">
                <span className="improvement-el">{fb.element} - {dimMap[fb.element] || fb.element}</span>
                <span className={'severity-' + (fb.severity || 'low')}>{fb.severity}</span>
              </div>
              <div style={{ display:'flex', alignItems:'flex-start', gap:'.6rem', padding:'.55rem .85rem', lineHeight:1.55 }}>
                <span style={{ fontFamily:'var(--mono)', fontSize:'.63rem', fontWeight:600, color:s.color, background:s.bg, border:'1px solid ' + s.border, borderRadius:'2px', padding:'.1rem .45rem', whiteSpace:'nowrap', marginTop:'.12rem', flexShrink:0 }}>
                  {s.label}
                </span>
                <span style={{ fontSize:'.82rem', color:'var(--ink)' }}>{fb.note}</span>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

function AbstractResult({ data }) {
  var fw = (data && data._fw) || ABSTRACT_FRAMEWORKS['article'];
  var dimKeys = Object.keys(fw.dims);
  var sc = data.scores || {};
  var total = dimKeys.reduce(function(acc, d) { return acc + (sc[d] || 0); }, 0);
  var maxScore = dimKeys.length * 20;
  var cols = Math.min(dimKeys.length, 5);
  var scoreColor = function(v) { return v >= 15 ? 'var(--accent)' : v >= 10 ? '#b87c00' : '#8b2020'; };
  return (
    <>
      <div className="slabel">{fw.name} Scores</div>
      <div className="abst-score-grid" style={{ gridTemplateColumns: 'repeat(' + cols + ',1fr)' }}>
        {dimKeys.map(function(d) {
          return (
            <div key={d} className="abst-score-box">
              <span className="abst-score-val" style={{ color: scoreColor(sc[d] || 0) }}>{sc[d] || 0}/20</span>
              <span className="abst-score-lbl">{fw.dims[d]}</span>
            </div>
          );
        })}
      </div>
      <p style={{ fontFamily:'var(--mono)', fontSize:'.78rem', color:'var(--muted)', marginBottom:'.75rem' }}>
        Total: <strong style={{ color:'var(--accent)' }}>{total}/{maxScore}</strong>
      </p>
      {data.verdict && <p className="abst-verdict">{data.verdict}</p>}
      <WritingFeedback items={data.feedback || []} dimMap={fw.dims} />
    </>
  );
}

  return (
    <>
      <div className="slabel">FINER Scores</div>
      <div className="rq-score-grid">
        {['F','I','N','E','R'].map(function(k) {
          return (
            <div key={k} className="abst-score-box">
              <span className="abst-score-val" style={{ color: scoreColor(sc[k] || 0) }}>{sc[k] || 0}/20</span>
              <span className="abst-score-lbl">{FINER[k]}</span>

        <>
          <div className="slabel" style={{ marginTop:'.75rem' }}>Feedback</div>
          <div style={{ display:'grid', gap:'.6rem' }}>
            {(data.feedback || []).map(function(fb, i) {
              return (
                <div key={i} className="rq-criterion">
                  <div className="rq-crit-head">
                    <span className="improvement-el">{fb.criterion} - {FINER[fb.criterion] || fb.criterion}</span>

function ContributionResult({ data }) {
  var score = data.clarity_score || 0;
  var scoreColor = score >= 70 ? 'var(--accent)' : score >= 50 ? '#b87c00' : '#8b2020';
  var statusClass = function(s) {
    if (s === 'supported') return 'badge badge-supported';
    if (s === 'asserted')  return 'badge badge-asserted';
    return 'badge badge-vague';
  };
  return (
    <>
      <div className="clarity-score-wrap">
        <span className="clarity-score-big" style={{ color: scoreColor }}>{score}</span>
        <span className="clarity-score-lbl">/ 100 Contribution Clarity Score</span>
      </div>
      {data.verdict && <p className="abst-verdict">{data.verdict}</p>}
      <div className="slabel">Novelty Claims</div>
      <div style={{ display:'grid', gap:'.6rem' }}>
        {(data.claims || []).map(function(c, i) {
          return (
            <div key={i} className="contrib-claim">
              <div className="contrib-claim-head">
                <span className={statusClass(c.status)}>{c.status}</span>
              </div>
              <div className="contrib-quote">"{c.quote}"</div>
              <div className="contrib-advice">{c.advice}</div>
            </div>
          );
        })}
      </div>
    </>
  );
}

function KeywordsResult({ data }) {
  var actionStyle = function(a) {
    if (a === 'keep')    return { bg:'#e8f5e9', color:'#2d7a3a', border:'#c3e6cb', label:'✓ keep' };
    if (a === 'remove')  return { bg:'#fff0f0', color:'#c0392b', border:'#f5c6c6', label:'✕ remove' };
    if (a === 'replace') return { bg:'#fff3cd', color:'#856404', border:'#ffc107', label:'↔ replace' };
    return                     { bg:'var(--hi)', color:'var(--accent)', border:'rgba(196,84,26,.25)', label:'↑ refine' };
  };
  var roleIcon = function(r) {
    return r === 'topic-anchor' ? '🎯' : r === 'method-signal' ? '⚗' : r === 'population-marker' ? '👥' : r === 'outcome-indicator' ? '📊' : '⚠';
  };
  var layerColor = { method:'#1565c0', population:'#6a1b9a', outcome:'#e65100', topic:'#2d7a3a' };
  return (
    <>
      {data.overall && <p className="abst-verdict">{data.overall}</p>}

      {(data.missing_layers || []).length > 0 && (
        <div style={{ background:'#fff8e1', border:'1px solid #ffe082', borderRadius:'8px', padding:'.6rem .85rem', marginBottom:'.9rem', fontSize:'.8rem', color:'#5d4037' }}>
          ⚠ Missing retrieval layers: {data.missing_layers.map(function(l) {
            return <strong key={l} style={{ color: layerColor[l] || '#333', marginRight:'.35rem' }}>{l}</strong>;
          })}
          - add keywords covering these to improve discoverability.
        </div>
      )}

      <div className="slabel">Keyword Analysis</div>
      <div className="kw-list">
        {(data.keywords || []).map(function(k, i) {
          var ast = actionStyle(k.action);
          return (
            <div key={i} className="kw-card" style={{ borderLeft:'3px solid ' + ast.border }}>
              <div className="kw-card-head">
                <span className="kw-name">
                  {k.discoverability_role && <span title={k.discoverability_role} style={{ marginRight:'.3rem' }}>{roleIcon(k.discoverability_role)}</span>}
                  {k.keyword}
                </span>
                <div style={{ display:'flex', gap:'.35rem', flexWrap:'wrap', alignItems:'center' }}>
                  {k.specificity && <span className="badge" style={{ background:'var(--bg)', border:'1px solid var(--border)', color:'var(--muted)', fontSize:'.68rem' }}>{k.specificity}</span>}
                  {k.overlap_issue && k.overlap_issue !== 'none' && (
                    <span className="badge" style={{ background:'#fff8e1', border:'1px solid #ffe082', color:'#856404', fontSize:'.68rem' }}>overlaps "{k.overlap_issue}"</span>
                  )}
                  <span style={{ fontSize:'.72rem', fontWeight:600, padding:'.18rem .5rem', borderRadius:'6px', background: ast.bg, color: ast.color, border:'1px solid ' + ast.border }}>{ast.label}</span>
                </div>
              </div>
              <div className="kw-body">{k.note}</div>
            </div>
          );
        })}
      </div>

      {(data.suggested || []).length > 0 && (
        <>
          <div className="slabel" style={{ marginTop:'.9rem' }}>Suggested Keywords</div>
          <div className="kw-list">
            {(data.suggested || []).map(function(s, i) {
              var lc = layerColor[s.layer] || 'var(--accent)';
              return (

                  <div className="kw-card-head">
                    <span className="kw-name" style={{ color: lc }}>+ {s.keyword}</span>
                    {s.layer && <span className="badge" style={{ background:'var(--bg)', border:'1px solid var(--border)', color: lc, fontSize:'.68rem' }}>{s.layer}</span>}
                  </div>
                  <div className="kw-body">{s.rationale}</div>
                </div>
              );

      {data.boolean_query && (

        </div>
      )}

  );
}

/* ─────────────────────────────────────────────────────────────
   FULL PAPER REPORT COMPONENT
   ───────────────────────────────────────────────────────────── */

function FullPaperReport({ fpResult, paperType }) {
  var sections = fpResult.sections || [];
  var results  = fpResult.results  || {};
  var isDone   = fpResult.status === 'done';

  function sectionScore(key) {
    var r = results[key];
    if (!r || r.error || !(r.data)) return null;
    var fw = CHAPTER_FRAMEWORKS[key] || {};
    var dimKeys = Object.keys(fw.dims || {});
    var sc = r.data.scores || {};
    return dimKeys.reduce(function(acc, k) { return acc + (sc[k] || 0); }, 0);
  }

  function scorePill(score, max) {
    if (score === null) return null;
    var pct = max > 0 ? score / max : 0;
    var cls = pct >= 0.8 ? 'fp-score-hi' : pct >= 0.6 ? 'fp-score-mid' : 'fp-score-lo';
    return React.createElement('span', { className: 'fp-score-pill ' + cls }, score + '/' + max);
  }

  // Compute overall average for the done state
  var overallPct = null;
  if (isDone && sections.length > 0) {
    var totalPct = 0;
    var counted = 0;
    sections.forEach(function(sec) {
      var fw = CHAPTER_FRAMEWORKS[sec.key] || {};
      var score = sectionScore(sec.key);
      if (score !== null && fw.max) {
        totalPct += score / fw.max;
        counted++;
      }
    });
    if (counted > 0) overallPct = Math.round((totalPct / counted) * 100);
  }

  return (
    <>
      {fpResult.notes && (
        <div className="warn-box" style={{ marginBottom: '1rem' }}>{fpResult.notes}</div>
      )}

      {/* Overall score row */}
      {overallPct !== null && (
        <div className="fp-overall-row">
          <span className="fp-overall-lbl">Overall paper score</span>
          <span className="fp-overall-num">{overallPct}%</span>
        </div>
      )}

      {/* Section summary bar */}
      <div className="slabel" style={{ marginBottom: '.5rem' }}>
        {sections.length} section{sections.length !== 1 ? 's' : ''} detected
      </div>
      <div className="fp-summary-bar">
        {sections.map(function(sec) {
          var fw = CHAPTER_FRAMEWORKS[sec.key] || {};
          var r = results[sec.key];
          var score = sectionScore(sec.key);
          var wc = sec.text ? sec.text.trim().split(/\s+/).filter(Boolean).length : 0;
          return (
            <div key={sec.key} className="fp-section-row">
              <div>
                <span className="fp-section-name">{fw.label || sec.heading}</span>
                <span className="fp-section-fw">({fw.name || sec.key})</span>
              </div>
              <span className="fp-wc">{wc} words</span>
              {!r
                ? <span className="fp-pending">evaluating…</span>
                : r.error
                  ? <span className="fp-score-pill fp-score-lo">error</span>
                  : scorePill(score, fw.max || 100)
              }
            </div>
          );
        })}
      </div>

      {/* Full feedback per section */}
      {sections.map(function(sec) {
        var fw = CHAPTER_FRAMEWORKS[sec.key] || {};
        var r = results[sec.key];
        if (!r) return null;
        var score = sectionScore(sec.key);
        var pct = (fw.max && score !== null) ? Math.round(score / fw.max * 100) : null;
        var pillCls = pct === null ? '' : pct >= 80 ? 'fp-score-hi' : pct >= 60 ? 'fp-score-mid' : 'fp-score-lo';
        return (
          <div key={sec.key} className="fp-section-block">
            <div className="fp-section-head">
              <span className="step-badge">{fw.name || sec.key}</span>
              <span style={{ fontWeight: 500, fontSize: '.93rem', flex: 1 }}>
                {fw.label || sec.heading}
              </span>
              {pct !== null && (
                <span className={'fp-score-pill ' + pillCls}>{pct}%</span>
              )}
              {r.error && (
                <span className="fp-score-pill fp-score-lo">Failed</span>
              )}
            </div>
            <div className="fp-section-body">
              {r.error
                ? <ErrorBox msg={r.error} onAddKey={openKeyPanel} hasKey={!!groqKey} />
                : <ChapterResult data={r.data} chapterType={sec.key} />
              }
            </div>
          </div>
        );
      })}
    </>
  );
}

function _isRateLimitMsg(msg) {
  var m = (msg || '').toLowerCase();
  return m.includes('rate') || m.includes('capacity') || m.includes('quota') || m.includes('limit exceeded') || m.includes('too many') || m.includes('429');
}

function ErrorBox({ msg, onAddKey, hasKey }) {
  var rl = _isRateLimitMsg(msg);
  return (
    <div>
      <ErrorBox msg={msg} onAddKey={openKeyPanel} hasKey={!!groqKey} />
      {rl && !hasKey && (
        <div className="error-key-hint">
          <span>You can use your own <strong>free Groq API key</strong> to avoid this limit - no credit card needed.</span>
          <button onClick={onAddKey}>Add free key</button>
        </div>
      )}
      {rl && hasKey && (
        <div className="error-key-hint">
          <span>Your API key also hit its limit. Wait a moment, or check your <strong>Groq quota</strong> at console.groq.com.</span>
        </div>
      )}
    </div>
  );
}

function App() {

  const [chapterRunning, setChRunning]  = useState(false);
  // Research Question

  const [rqResult, setRqResult]         = useState(null);
  const [rqRunning, setRqRunning]       = useState(false);
  // Contribution Check
  const [contribResult, setContribRes]  = useState(null);
  const [contribRunning, setContribRun] = useState(false);
  // Keywords Optimizer
  const [keywordsText, setKeywords]     = useState('');
  const [kwResult, setKwResult]         = useState(null);
  const [kwRunning, setKwRunning]       = useState(false);
  // Full Paper Review
  const [fullPaperText, setFPText]      = useState('');
  const [fullPaperResult, setFPResult]  = useState(null);
  const [fullPaperRunning, setFPRunning]= useState(false);
  const [fpDragOver, setFpDragOver]     = useState(false);

  // API key
  const [groqKey, setGroqKey]           = useState(window._groqKey || '');
  const [groqKeyInput, setGroqKeyInput] = useState(window._groqKey || '');
  const [showKeyPanel, setShowKeyPanel] = useState(false);
  const [showSteps, setShowSteps]       = useState(false);

  useEffect(function() {
    window._onRateLimit = function() { setShowKeyPanel(true); };
    return function() { window._onRateLimit = null; };
  }, []);

  const openKeyPanel = function() { setShowKeyPanel(true); setShowSteps(false); };

  function saveGroqKey() {
    const k = groqKeyInput.trim();
    window._groqKey = k || null;
    if (k) { localStorage.setItem('titlesmart_groq_key', k); } else { localStorage.removeItem('titlesmart_groq_key'); }
    setGroqKey(k);
    if (k) setShowKeyPanel(false);
  }

  function clearGroqKey() {
    window._groqKey = null;
    localStorage.removeItem('titlesmart_groq_key');
    setGroqKey('');
    setGroqKeyInput('');
  }

  const endRef = useRef(null);

  // Reset chapterType when paper type changes to a type with a different chapter set.
  useEffect(function() {
    var set = CHAPTER_SETS[paperType] || CHAPTER_SETS['article'];
    if (set.indexOf(chapterType) === -1) {
      setChapterType(set[0]);
      setChapterRes(null);
    }
  }, [paperType]);

  // Scroll into view when new steps appear.
  useEffect(() => {
    if (Object.keys(steps).length > 0 && endRef.current) {
      endRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }, [steps]);

  // Update one step's data.
  const setStep = useCallback((n, patch) => {
    setSteps(prev => ({ ...prev, [n]: { ...(prev[n]||{}), ...patch } }));
  }, []);

  const wordCount = abstract.trim().split(/\s+/).filter(Boolean).length;
  const canRun = abstract.trim().length > 0 && !running;

  // Main pipeline.
  async function run() {
    setRunning(true);
    setSteps({});

    try {
      /* - Step 1: Field Detection - */
      setStep(1, { status: 'loading' });
      let field;
      try {
        const p = prompt1(abstract);
        field = await aiJson(p.system, p.user);
        setStep(1, { status: 'done', data: field });
      } catch (e) {
        setStep(1, { status: 'error', error: e.message });
        return;
      }

      /* - Step 2: Literature Search - fetch topic + method queries in parallel for richer corpus - */
      setStep(2, { status: 'loading', msg: 'Searching top-cited papers (topic + method queries in parallel)…' });
      var papers = [];
      var corpus = mineCorpus([]);
      var s2Ok = false;
      try {
        var [fetched1, fetched2] = await Promise.all([
          fetchPapers(field.search_query).catch(function() { return []; }),
          field.search_query_method
            ? fetchPapers(field.search_query_method).catch(function() { return []; })
            : Promise.resolve([]),
        ]);
        // Merge + deduplicate by title, then take top 20 by citation count
        var seenTitles = {};
        var merged = [];
        [fetched1, fetched2].forEach(function(batch) {
          batch.forEach(function(p) {
            var key = (p.title || '').toLowerCase().trim();
            if (key && !seenTitles[key]) { seenTitles[key] = true; merged.push(p); }
          });
        });
        merged.sort(function(a, b) { return (b.citationCount || 0) - (a.citationCount || 0); });
        var fetched = merged.slice(0, 20);

        if (fetched.length === 0) {
          setStep(2, { status: 'loading', msg: 'No results - retrying with broader query…' });
          await new Promise(function(r) { setTimeout(r, 1500); });
          fetched = await fetchPapers(field.search_query, true);
        }
        if (fetched.length > 0) {
          papers = fetched;
          corpus = mineCorpus(papers);
          s2Ok = true;
          setStep(2, { status: 'done', data: papers, corpus: corpus });
        } else {
          setStep(2, { status: 'warn', error: 'No papers found for this query. Titles will be generated from abstract only.' });
        }
      } catch (fetchErr) {
        var s2msg = fetchErr.message || '';
        var s2hint = s2msg.includes('429') ? ' (Semantic Scholar rate-limited)'
          : s2msg.includes('timeout') ? ' (Semantic Scholar timed out)'
          : ' (Semantic Scholar temporarily unavailable)';
        setStep(2, { status: 'warn', error: 'Literature search skipped' + s2hint + '. Titles will be generated from abstract only - accuracy may be reduced.' });
      }

      /* - Steps 3 + 4 - */
      /* Step 3 (corpus/relevance) only runs when papers were retrieved. */
      /* Step 4 (abstract decomposition) always runs - it only needs the abstract. */
      setStep(4, { status: 'loading' });
      var relevanceResult = { relevant_5: [], dominant_structure: '' };
      var decomp;

      if (s2Ok && papers.length > 0) {
        setStep(3, { status: 'loading' });
        try {
          var pRel = promptRelevance(abstract, papers, corpus);
          var pDec = promptDecomp(abstract);
          var parallel = await Promise.all([
            aiJson(pRel.system, pRel.user),
            aiJson(pDec.system, pDec.user),
          ]);
          relevanceResult = parallel[0];
          decomp = parallel[1];
          setStep(3, { status: 'done', data: corpus, relevance: relevanceResult, papers: papers });
          setStep(4, { status: 'done', data: decomp });
        } catch (analysisErr) {
          setStep(3, { status: 'error', error: analysisErr.message });
          setStep(4, { status: 'error', error: analysisErr.message });
          return;
        }
      } else {
        // No papers - run decomp alone
        try {
          var pDec2 = promptDecomp(abstract);
          decomp = await aiJson(pDec2.system, pDec2.user);
          setStep(4, { status: 'done', data: decomp });
        } catch (decompErr) {
          setStep(4, { status: 'error', error: decompErr.message });
          return;
        }
      }

      /* - Steps 5 + 6: Titles + Winner - */
      setStep(5, { status: 'loading' });
      setStep(6, { status: 'loading' });
      try {
        var rel5papers = (relevanceResult.relevant_5 || [])
          .map(function(i) { return papers[i - 1]; })
          .filter(Boolean);
        var p5 = prompt3(abstract, field, corpus, relevanceResult.dominant_structure || '', decomp, rel5papers, paperType);
        var result = await aiJson(p5.system, p5.user);
        var winnerTitle = (result.winner && result.winner.title) || '';
        setStep(5, { status: 'done', data: result.titles || [], winnerTitle: winnerTitle });
        setStep(6, { status: 'done', data: result.winner });
      } catch (titleErr) {
        setStep(5, { status: 'error', error: titleErr.message });
        setStep(6, { status: 'error', error: titleErr.message });
        return;
      }

    } catch (e) {
      console.error('Unexpected error:', e);
    } finally {
      setRunning(false);
    }
  }

  async function runJournals() {
    setJRunning(true);
    setJSteps({ status: 'loading', msg: 'Loading journal database…' });

    try {
      var tierDef = IF_TIERS.find(function(t){ return t.key === (journalPrefs.ifTier || 'any'); }) || IF_TIERS[0];

      // Collect manuscript signals: title + optimized keywords + abstract
      var recTitle    = (steps[5] && steps[5].winnerTitle) || '';
      var suggestedKws = ((kwResult && kwResult.data && kwResult.data.suggested) || []).map(function(k){ return k.keyword; });
      var keptKws     = ((kwResult && kwResult.data && kwResult.data.keywords) || [])
        .filter(function(k){ return k.action === 'keep' || k.action === 'refine'; })
        .map(function(k){ return k.keyword; });
      var allKws      = suggestedKws.concat(keptKws).filter(function(k, i, a){ return a.indexOf(k) === i; });

      var manuscript  = { title: recTitle, abstract: abstract, keywords: allKws };
      var prefs       = { tierDef: tierDef, access: journalPrefs.access, oaMandate: journalPrefs.oaMandate, paperType: paperType };

      // ── STEP 1: keyword pre-filter from curated DB ────────────────────────
      setJSteps({ status: 'loading', msg: 'Matching manuscript to journal database…' });

      // ── STEP 2: AI ranks subset by scope, STEP 3: OpenAlex verifies IF ───
      setJSteps({ status: 'loading', msg: 'AI scope-matching against curated journals…' });
      var enriched = await JournalRecommender.recommend(manuscript, prefs);

      // ── STEP 4: Apply IF tier filter ──────────────────────────────────────
      var filterNote = null;
      var display    = enriched;

      if (tierDef.key !== 'any') {
        var ifFiltered = enriched.filter(function(j){
          var ifVal = j.impact_factor;
          if (ifVal == null) return true;
          if (tierDef.min !== null && ifVal < tierDef.min) return false;
          if (tierDef.max !== null && ifVal > tierDef.max) return false;
          return true;
        });
        display    = ifFiltered.length > 0 ? ifFiltered : enriched;
        filterNote = ifFiltered.length > 0
          ? 'IF filter: ' + tierDef.range
          : 'No verified matches for IF ' + tierDef.range + ' - showing closest scope matches';
      }

      if (journalPrefs.access === 'open-access' || journalPrefs.access === 'oa') {
        var oaOnly = display.filter(function(j){ return j.open_access || j.access_type === 'open-access'; });
        if (oaOnly.length > 0) display = oaOnly;
        else filterNote = (filterNote ? filterNote + '; ' : '') + 'No OA matches - showing all access types';
      }

      setJSteps({
        status:      'done',
        data:        display.slice(0, 5),
        ifFilterNote: filterNote,
        totalFound:  enriched.length,
        searchAngles: [],
      });

    } catch(outerErr) {
      setJSteps({ status: 'error', error: outerErr.message });
    } finally {
      setJRunning(false);
    }
  }

  async function runKeywords() {

  async function handleAbstractFile(file) {
    if (!file) return;
    var name = (file.name || '').toLowerCase();
    setAbstractUploading(true);
    try {
      var rawText = '';

      if (name.endsWith('.txt') || name.endsWith('.md')) {
        rawText = await new Promise(function(resolve, reject) {
          var reader = new FileReader();
          reader.onload = function(e) { resolve(e.target.result || ''); };
          reader.onerror = function() { reject(new Error('Could not read file.')); };
          reader.readAsText(file);
        });
      } else if (name.endsWith('.pdf')) {
        if (typeof pdfjsLib === 'undefined') {
          alert('PDF library not loaded yet - please wait a moment and try again.');
          return;
        }
        var buf = await file.arrayBuffer();
        var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        var pages = [];
        for (var i = 1; i <= pdf.numPages; i++) {
          var page = await pdf.getPage(i);
          var content = await page.getTextContent();
          pages.push(content.items.map(function(s) { return s.str; }).join(' '));
        }
        rawText = pages.join('\n');
      } else if (name.endsWith('.docx')) {
        if (typeof mammoth === 'undefined') {
          alert('DOCX library not loaded yet - please wait a moment and try again.');
          return;
        }
        var buf2 = await file.arrayBuffer();
        var res = await mammoth.extractRawText({ arrayBuffer: buf2 });
        rawText = res.value || '';
      } else {
        alert('Unsupported format. Supported: .pdf, .docx, .txt, .md');
        return;
      }

      // Try to extract just the abstract section from a full paper
      var extracted = '';
      var absMatch = rawText.match(
        /\bAbstract\b[\s\r\n:-–-]*([\s\S]{80,2000?})(?=\n\s*\n|\b(?:Introduction|Keywords|Background|1\.|1\s+Introduction)\b)/i
      );
      if (absMatch) {
        extracted = absMatch[1].trim();
      } else {
        // No clear abstract section found - use the first 600 words as a best guess
        var words = rawText.trim().split(/\s+/);
        extracted = words.slice(0, 600).join(' ');
        if (words.length > 600) {
          extracted += '\n\n[Note: abstract section not detected - showing first 600 words. Please trim to your abstract only.]';
        }
      }

      setAbstract(extracted.trim());
    } catch(e) {
      alert('Could not read file: ' + e.message);
    } finally {
      setAbstractUploading(false);
    }
  }

  async function handleFPFile(file) {
    if (!file) return;
    var name = (file.name || '').toLowerCase();
    try {
      if (name.endsWith('.txt') || name.endsWith('.md')) {
        var reader = new FileReader();
        reader.onload = function(e) { setFPText(e.target.result || ''); };
        reader.onerror = function() { alert('Could not read file.'); };
        reader.readAsText(file);
        return;
      }
      if (name.endsWith('.pdf')) {
        if (typeof pdfjsLib === 'undefined') {
          alert('PDF library not loaded yet - please wait a moment and try again.');
          return;
        }
        var buf = await file.arrayBuffer();
        var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        var text = '';
        for (var i = 1; i <= pdf.numPages; i++) {
          var page = await pdf.getPage(i);
          var content = await page.getTextContent();
          text += content.items.map(function(s) { return s.str; }).join(' ') + '\n';
        }
        setFPText(text.trim());
        return;
      }
      if (name.endsWith('.docx')) {
        if (typeof mammoth === 'undefined') {
          alert('DOCX library not loaded yet - please wait a moment and try again.');
          return;
        }
        var buf2 = await file.arrayBuffer();
        var result = await mammoth.extractRawText({ arrayBuffer: buf2 });
        setFPText(result.value || '');
        return;
      }
      alert('Unsupported file type. Supported formats: .txt, .md, .pdf, .docx');
    } catch(e) {
      alert('Could not read file: ' + e.message);
    }
  }

  async function runFullPaper() {

    if (!fullPaperText.trim()) return;
    setFPRunning(true);
    setFPResult({ status: 'segmenting', sections: [], results: {} });

    try {
      // Step 1: Ask AI to detect and extract sections
      var ps = promptSegment(fullPaperText, paperType);
      var segResult;
      try {
        segResult = await aiJson(ps.system, ps.user);
      } catch(segErr) {
        setFPResult({ status: 'error', error: 'Section detection failed: ' + segErr.message });
        return;
      }

      // Validate keys, then extract section texts from the original paper using JS
      var validKeys = CHAPTER_SETS[paperType] || CHAPTER_SETS['article'];
      var validKeySet = {};
      validKeys.forEach(function(k) { validKeySet[k] = true; });

      var validHeadings = (segResult.sections || []).filter(function(sec) {
        return sec.key && validKeySet[sec.key] && sec.heading;
      });

      var sections = extractSectionTexts(fullPaperText, validHeadings);

      if (sections.length === 0) {
        setFPResult({
          status: 'error',
          error: 'Could not locate section headings in the text. Make sure your paper has clear section headings (e.g. "Introduction", "Methods", "Discussion"). For papers without explicit headings, paste each section individually using the Chapter Review tab.'
        });
        return;
      }

      setFPResult({ status: 'running', sections: sections, results: {}, notes: segResult.notes || null });

      // Step 2: Evaluate all sections in parallel - update UI as each one completes
      var promises = sections.map(function(sec) {
        var pc = promptChapter(sec.key, sec.text, paperType);
        return aiJson(pc.system, pc.user)
          .then(function(res) {
            setFPResult(function(prev) {
              var nr = {};
              Object.keys(prev.results || {}).forEach(function(k) { nr[k] = prev.results[k]; });
              nr[sec.key] = { data: res };
              return { status: prev.status, sections: prev.sections, results: nr, notes: prev.notes };
            });
            return { key: sec.key, data: res };
          })
          .catch(function(err) {
            setFPResult(function(prev) {
              var nr = {};
              Object.keys(prev.results || {}).forEach(function(k) { nr[k] = prev.results[k]; });
              nr[sec.key] = { error: err.message };
              return { status: prev.status, sections: prev.sections, results: nr, notes: prev.notes };
            });
            return { key: sec.key, error: err.message };
          });
      });

      await Promise.all(promises);

      setFPResult(function(prev) {
        return { status: 'done', sections: prev.sections, results: prev.results, notes: prev.notes };
      });

    } catch(e) {
      setFPResult({ status: 'error', error: e.message });
    } finally {
      setFPRunning(false);
    }
  }
