  const [contribResult, setContribRes]  = useState(null);
  const [contribRunning, setContribRun] = useState(false);
  // Keywords Optimizer
  const [keywordsText, setKeywords]     = useState('');
  const [kwResult, setKwResult]         = useState(null);
  const [kwRunning, setKwRunning]       = useState(false);

  const settingsRef = useRef(null);
  const endRef      = useRef(null);

  const provider   = modelProvider(selectedModel);
  const currentKey = keys[provider] || '';

  // Persist model choice and all keys to sessionStorage.
  useEffect(function() {
    sessionStorage.setItem('ts_model', selectedModel);
  }, [selectedModel]);

  useEffect(function() {
    Object.keys(keys).forEach(function(p) {
      if (keys[p]) sessionStorage.setItem('ts_key_' + p, keys[p]);
      else sessionStorage.removeItem('ts_key_' + p);
    });
  }, [keys]);

  function setProviderKey(val) {
    setKeys(function(prev) {
      const next = {};
      Object.keys(prev).forEach(function(k) { next[k] = prev[k]; });
      next[provider] = val;
      return next;
    });
  }

  // Scroll into view when new steps appear.
  useEffect(() => {
    if (Object.keys(steps).length > 0 && endRef.current) {
      endRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }, [steps]);

  // Update one step's data.
  const setStep = useCallback((n, patch) => {
    setSteps(prev => ({ ...prev, [n]: { ...(prev[n]||{}), ...patch } }));
  }, []);

  const wordCount = abstract.trim().split(/\s+/).filter(Boolean).length;
  const canRun = abstract.trim().length > 0 && !running;

  // Main pipeline.
  async function run() {
    if (!currentKey) {
      setSettings(true);
      setTimeout(function() {
        const el = settingsRef.current && settingsRef.current.querySelector('input[type="password"]');
        if (el) el.focus();
      }, 150);
      return;
    }
    setRunning(true);
    setSteps({});

    try {
      /* — Step 1: Field Detection — */
      setStep(1, { status: 'loading' });
      let field;
      try {
        const p = prompt1(abstract);
        field = await aiJson(selectedModel, currentKey, p.system, p.user);
        setStep(1, { status: 'done', data: field });
      } catch (e) {
        setStep(1, { status: 'error', error: e.message });
        return;
      }

      /* — Step 2: Literature Search + JS Pre-computation — */
      setStep(2, { status: 'loading' });
      var papers;
      var corpus;
      try {
        papers = await fetchPapers(field.search_query);
        if (papers.length === 0) {
          setStep(2, { status: 'loading', msg: 'No results — retrying with broader query…' });
          await new Promise(function(r) { setTimeout(r, 1800); });
          papers = await fetchPapers(field.search_query, true);
        }
        if (papers.length === 0) {
          setStep(2, { status: 'error', error: 'No papers found. Try rephrasing your abstract or check your connection.' });
          return;
        }
        // Pre-compute real corpus statistics in JavaScript — no AI involved.
        corpus = mineCorpus(papers);
        setStep(2, { status: 'done', data: papers, corpus: corpus });
      } catch (fetchErr) {
        try {
          setStep(2, { status: 'loading', msg: 'Retrying search…' });
          await new Promise(function(r) { setTimeout(r, 1800); });
          papers = await fetchPapers(field.search_query, true);
          corpus = mineCorpus(papers);
          setStep(2, { status: 'done', data: papers, corpus: corpus });
        } catch (fetchErr2) {
          setStep(2, { status: 'error', error: 'Literature search failed: ' + fetchErr2.message });
          return;
        }
      }

      /* — Steps 3 + 4: Relevance/Structure (AI) + Decomposition (AI) — run in parallel — */
      setStep(3, { status: 'loading' });
      setStep(4, { status: 'loading' });
      var relevanceResult;
      var decomp;
      try {
        var pRel = promptRelevance(abstract, papers, corpus);
        var pDec = promptDecomp(abstract);
        // Both calls are independent — run together to save time
        var parallel = await Promise.all([
          aiJson(selectedModel, currentKey, pRel.system, pRel.user),
          aiJson(selectedModel, currentKey, pDec.system, pDec.user),
        ]);
        relevanceResult = parallel[0];
        decomp = parallel[1];
        setStep(3, { status: 'done', data: corpus, relevance: relevanceResult, papers: papers });
        setStep(4, { status: 'done', data: decomp });
      } catch (analysisErr) {
        setStep(3, { status: 'error', error: analysisErr.message });
        setStep(4, { status: 'error', error: analysisErr.message });
        return;
      }

      /* — Steps 5 + 6: Titles + Winner — */
      setStep(5, { status: 'loading' });
      setStep(6, { status: 'loading' });
      try {
        var rel5papers = (relevanceResult.relevant_5 || [])
          .map(function(i) { return papers[i - 1]; })
          .filter(Boolean);
        var p5 = prompt3(abstract, field, corpus, relevanceResult.dominant_structure || '', decomp, rel5papers, paperType);
        var result = await aiJson(selectedModel, currentKey, p5.system, p5.user);
        var winnerTitle = (result.winner && result.winner.title) || '';
        setStep(5, { status: 'done', data: result.titles || [], winnerTitle: winnerTitle });
        setStep(6, { status: 'done', data: result.winner });
      } catch (titleErr) {
        setStep(5, { status: 'error', error: titleErr.message });
        setStep(6, { status: 'error', error: titleErr.message });
        return;
      }

    } catch (e) {
      console.error('Unexpected error:', e);
    } finally {
      setRunning(false);
    }
  }

  async function runJournals() {
    if (!currentKey) {
      setSettings(true);
      setTimeout(function() {
        var el = settingsRef.current && settingsRef.current.querySelector('input[type="password"]');
        if (el) el.focus();
      }, 150);
      return;
    }
    setJRunning(true);
    setJSteps({ status: 'loading', msg: 'Analysing abstract field…' });

    try {
      var p1 = promptJournal1(abstract);
      var fieldInfo;
      try {
        fieldInfo = await aiJson(selectedModel, currentKey, p1.system, p1.user);
      } catch(fe) {
        setJSteps({ status: 'error', error: 'Field analysis failed: ' + fe.message });
        return;
      }

      setJSteps({ status: 'loading', msg: 'Searching journal databases…' });
      var allJournals = [];
      var terms = fieldInfo.search_terms || [fieldInfo.field || 'academic research'];

      for (var ti = 0; ti < Math.min(terms.length, 2); ti++) {
        try {
          var batch = await fetchJournals(terms[ti]);
          for (var bi = 0; bi < batch.length; bi++) {
            var dup = false;
            for (var ai = 0; ai < allJournals.length; ai++) {
              if (allJournals[ai].id === batch[bi].id) { dup = true; break; }
            }
            if (!dup) allJournals.push(batch[bi]);
          }
        } catch(te) { /* skip failed term */ }
      }

      if (allJournals.length === 0) {
        try {
          allJournals = await fetchJournals(fieldInfo.field || abstract.split(' ').slice(0, 4).join(' '));
        } catch(fallbackErr) {
          setJSteps({ status: 'error', error: 'Journal search failed. Check your internet connection.' });
          return;
        }
      }

      setJSteps({ status: 'loading', msg: 'Ranking journals for your paper…' });
      var p2 = promptJournal2(abstract, fieldInfo.field || '', fieldInfo.methodology || '', allJournals, journalPrefs, paperType);
      var ranked;
      try {
        ranked = await aiJson(selectedModel, currentKey, p2.system, p2.user);
      } catch(re) {
        setJSteps({ status: 'error', error: 'Journal ranking failed: ' + re.message });
        return;
      }

      setJSteps({ status: 'done', data: ranked.journals || [] });
    } catch(outerErr) {
      setJSteps({ status: 'error', error: outerErr.message });
    } finally {
      setJRunning(false);
    }
  }

  async function runAbstract() {
    if (!currentKey) {
      setSettings(true);
      setTimeout(function() {
        var el = settingsRef.current && settingsRef.current.querySelector('input[type="password"]');
        if (el) el.focus();
      }, 150);
      return;
    }
    setARunning(true);
    setAbstRes({ status: 'loading' });

    try {
      var pa = promptAbstract(abstract, paperType);
      var resultA;
      try {
        resultA = await aiJson(selectedModel, currentKey, pa.system, pa.user);
      } catch(aiErr) {
        setAbstRes({ status: 'error', error: aiErr.message });
        return;
      }
      resultA.original = abstract;
      resultA._fw = ABSTRACT_FRAMEWORKS[paperType] || ABSTRACT_FRAMEWORKS['article'];
      setAbstRes({ status: 'done', data: resultA });
    } catch(wrapErr) {
      setAbstRes({ status: 'error', error: wrapErr.message });
    } finally {
      setARunning(false);
    }
  }

  async function runConclusion() {
    if (!currentKey) {
      setSettings(true);
      setTimeout(function() {
        var el = settingsRef.current && settingsRef.current.querySelector('input[type="password"]');
        if (el) el.focus();
      }, 150);
      return;
    }
    setCRunning(true);
    setConcRes({ status: 'loading' });
    try {
      var pc = promptConclusion(conclusion, paperType);
      var resultC;
      try {
        resultC = await aiJson(selectedModel, currentKey, pc.system, pc.user);
      } catch(aiErr) {
        setConcRes({ status: 'error', error: aiErr.message });
        return;
      }
      resultC._fw = CONCLUSION_FRAMEWORKS[paperType] || CONCLUSION_FRAMEWORKS['article'];
      setConcRes({ status: 'done', data: resultC });
    } catch(wrapErr) {
      setConcRes({ status: 'error', error: wrapErr.message });
    } finally {
      setCRunning(false);
    }
  }

  function openSettings() {
    setSettings(true);
    setTimeout(function() {
      var el = settingsRef.current && settingsRef.current.querySelector('input[type="password"]');
      if (el) el.focus();
    }, 150);
  }

  async function runChapter() {
    if (!currentKey) { openSettings(); return; }
    setChRunning(true);
    setChapterRes({ status: 'loading' });
    try {
      var pc = promptChapter(chapterType, chapterText, paperType);
      var result;
      try {
        result = await aiJson(selectedModel, currentKey, pc.system, pc.user);
      } catch(aiErr) {
        setChapterRes({ status: 'error', error: aiErr.message });
        return;
      }
      setChapterRes({ status: 'done', data: result, chapterType: chapterType });
    } catch(e) {
      setChapterRes({ status: 'error', error: e.message });
    } finally {
      setChRunning(false);
    }
  }

  async function runResearchQ() {
    if (!currentKey) { openSettings(); return; }
    setRqRunning(true);
    setRqResult({ status: 'loading' });
    try {
      var pr = promptResearchQ(rqText, studyType, paperType);
      var result;
      try {
        result = await aiJson(selectedModel, currentKey, pr.system, pr.user);
      } catch(aiErr) {
        setRqResult({ status: 'error', error: aiErr.message });
        return;
      }
      setRqResult({ status: 'done', data: result });
    } catch(e) {
      setRqResult({ status: 'error', error: e.message });
    } finally {
      setRqRunning(false);
    }
  }

  async function runContribution() {
    if (!currentKey) { openSettings(); return; }
    setContribRun(true);
    setContribRes({ status: 'loading' });
    try {
      var pc = promptContribution(abstract, paperType);
      var result;
      try {
        result = await aiJson(selectedModel, currentKey, pc.system, pc.user);
      } catch(aiErr) {
        setContribRes({ status: 'error', error: aiErr.message });
        return;
      }
      setContribRes({ status: 'done', data: result });
    } catch(e) {
      setContribRes({ status: 'error', error: e.message });
    } finally {
      setContribRun(false);
    }
  }

  async function runKeywords() {
    if (!currentKey) { openSettings(); return; }
    var kws = keywordsText.split(/[,\n]+/).map(function(k) { return k.trim(); }).filter(Boolean);
    if (kws.length === 0) return;
    setKwRunning(true);
    setKwResult({ status: 'loading', msg: 'Searching Semantic Scholar for each keyword…' });
    try {
      var counts = await Promise.all(kws.map(function(kw) {
        return fetch(S2_BASE + '/paper/search?query=' + encodeURIComponent(kw) + '&fields=paperId&limit=1')
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(d) { return { keyword: kw, count: d ? (d.total || 0) : null }; })
          .catch(function(e) { return { keyword: kw, count: null }; });
      }));
      setKwResult({ status: 'loading', msg: 'Analysing keywords with AI…' });
      var pk = promptKeywords(abstract, counts, paperType);
      var result;
      try {
        result = await aiJson(selectedModel, currentKey, pk.system, pk.user);
      } catch(aiErr) {
        setKwResult({ status: 'error', error: aiErr.message });
        return;
      }
      setKwResult({ status: 'done', data: result });
    } catch(e) {
      setKwResult({ status: 'error', error: e.message });
    } finally {
      setKwRunning(false);
    }
  }

  function reset() {
    setSteps({});
    setJSteps(null);
    setAbstRes(null);
    setConcRes(null);
    setChapterRes(null);
    setRqResult(null);
    setContribRes(null);
    setKwResult(null);
    setAbstract('');
    setConclusion('');
    setChapterText('');
    setRqText('');
    setKeywords('');
    setRunning(false);
    setJRunning(false);
    setARunning(false);
    setCRunning(false);
    setChRunning(false);
    setRqRunning(false);
    setContribRun(false);
    setKwRunning(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  const s = steps;
  const relevantSet = (s[3] && s[3].relevance && s[3].relevance.relevant_5)
    ? new Set(s[3].relevance.relevant_5)
    : null;

  return (
    <div className="container">

      {/* ── Header ── */}
      <header className="header">
        <p className="eyebrow">Academic Tool</p>
        <h1>Title<em>Smart</em></h1>
        <p className="tagline">Paste your abstract. We handle the rest.</p>
      </header>

      {/* ── Settings ── */}
      <button
        className={'settings-toggle' + (!currentKey ? ' needs-key' : '')}
        onClick={function() { setSettings(function(o) { return !o; }); }}
        aria-expanded={settingsOpen}
        aria-controls="settings-panel"
      >
        ⚙ Settings {!currentKey && '— API key required'}
      </button>

      {settingsOpen && (
        <div className="settings-panel" id="settings-panel" ref={settingsRef} role="region" aria-label="Settings">

          {/* Model picker */}
          <div className="field-label" style={{ marginBottom:'.6rem' }}>AI Model</div>
          <div className="model-picker">
            {['groq','claude','openai','gemini'].map(function(prov) {
              const provModels = MODELS.filter(function(m) { return m.provider === prov; });
              return (
                <div key={prov} className="model-group">
                  <span className="model-group-label" style={{ color: PROVIDERS[prov].color }}>
                    {PROVIDERS[prov].label}
                  </span>
                  <div className="model-group-btns">
                    {provModels.map(function(m) {
                      return (
                        <button
                          key={m.id}
                          className={'model-btn' + (selectedModel === m.id ? ' active' : '')}
                          style={ selectedModel === m.id ? { borderColor: PROVIDERS[prov].color, color: PROVIDERS[prov].color, background: PROVIDERS[prov].color + '12' } : {} }
                          onClick={function() { setModel(m.id); }}
                          type="button"
                        >
                          {m.label}
                          {m.badge && <span className="model-badge">{m.badge}</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>

          {/* API key for current provider */}
          <div style={{ marginTop:'1.1rem' }}>
            <label className="field-label" htmlFor="api-key">
              {PROVIDERS[provider].label} API Key
            </label>
            <input
              id="api-key"
              type="password"
              value={currentKey}
              onChange={function(e) { setProviderKey(e.target.value); }}
              placeholder={PROVIDERS[provider].placeholder}
              autoComplete="off"
            />
            <p className="key-note">{PROVIDERS[provider].note} · Stored in sessionStorage only, never logged.</p>
            <button
              className="key-guide-toggle"
              onClick={function() { setKeyGuide(function(o) { return !o; }); }}
              type="button"
            >
              {keyGuideOpen ? '▲ Hide steps' : '▼ How to get a free API key'}
            </button>
            {keyGuideOpen && KEY_STEPS[provider] && (
              <div className="key-guide">
                <p className="key-guide-title">Step-by-step: {PROVIDERS[provider].label} API Key</p>
                <ol className="key-steps">
                  {KEY_STEPS[provider].steps.map(function(step, i) {
                    return (
                      <li key={i} className="key-step">
                        <span className="key-step-num">{i + 1}</span>
                        <span>{step}</span>
                      </li>
                    );
                  })}
                </ol>
                <span className="key-guide-url">{KEY_STEPS[provider].url}</span>
              </div>
            )}
          </div>

        </div>
      )}

      {/* ── Paper type bar ── */}
      <div className="paper-type-bar">
        <span className="paper-type-lbl">Paper type:</span>
        {PAPER_TYPES.map(function(pt) {
          return (
            <button
              key={pt.key}
              className={'pt-btn' + (paperType === pt.key ? ' active' : '')}
              onClick={function() { setPaperType(pt.key); }}
              type="button"
            >{pt.label}</button>
          );
        })}
      </div>

      {/* ── Mode tabs ── */}
      <div className="mode-tabs" role="tablist">
        {[
          { key: 'title',        label: 'Title Recommender'   },
          { key: 'journal',      label: 'Journal Suggester'   },
          { key: 'abstract',     label: 'Abstract Feedback'   },
          { key: 'conclusion',   label: 'Conclusion Feedback' },
          { key: 'chapter',      label: 'Chapter Review'      },
          { key: 'research-q',   label: 'Research Question'   },
          { key: 'contribution', label: 'Contribution Check'  },
          { key: 'keywords',     label: 'Keywords Optimizer'  },
        ].map(function(m) {
          return (
            <button
              key={m.key}
              className={'mode-tab' + (mode === m.key ? ' active' : '')}
              onClick={function() { setMode(m.key); }}
              role="tab"
              aria-selected={mode === m.key}
              type="button"
            >
              {m.label}
            </button>
          );
        })}
      </div>

      {/* ── Conclusion mode ── */}
      {mode === 'conclusion' && (
        <div>
          <label htmlFor="conclusion-text" style={{ display:'block', fontWeight:600, marginBottom:'.45rem' }}>Conclusion</label>
          <textarea
            id="conclusion-text"
            value={conclusion}
            onChange={function(e) { setConclusion(e.target.value); }}
            placeholder="Paste your conclusion section here…"
            disabled={conclusionRunning}
          />
          <div className="word-count">{conclusion.trim().split(/\s+/).filter(Boolean).length} words</div>
          <button className="btn-primary" onClick={runConclusion} disabled={!conclusion.trim() || conclusionRunning} aria-busy={conclusionRunning}>
            {conclusionRunning ? <><span className="dots" aria-hidden="true"><span/><span/><span/></span> Analysing…</> : 'Get Conclusion Feedback'}
          </button>
        </div>
      )}

      {/* ── Chapter Review mode ── */}
      {mode === 'chapter' && NO_CHAPTER_TYPES.indexOf(paperType) !== -1 && (
        <div className="warn-box" style={{ marginBottom:'1rem' }}>
          Chapter review is designed for full research articles. For <strong>{paperType.replace('-', ' ')}</strong>, the <strong>Abstract Feedback</strong> or <strong>Contribution Check</strong> tools are more applicable.
        </div>
      )}
      {mode === 'chapter' && NO_CHAPTER_TYPES.indexOf(paperType) === -1 && (
        <div>
          <div className="sub-tabs" role="tablist">
            {[
              { key:'introduction', lbl:'Introduction (CARS)'   },
              { key:'litreview',    lbl:'Lit Review (DEPTH)'    },
              { key:'methods',      lbl:'Methods (RECIPE)'      },
              { key:'results',      lbl:'Results (CLEAR)'       },
              { key:'discussion',   lbl:'Discussion (SODA)'     },
            ].map(function(ch) {
              return (
                <button
                  key={ch.key}
                  className={'sub-tab' + (chapterType === ch.key ? ' active' : '')}
                  onClick={function() { setChapterType(ch.key); setChapterRes(null); }}
                  role="tab"
                  type="button"
                >{ch.lbl}</button>
              );
            })}
          </div>
          <label htmlFor="chapter-text" style={{ display:'block', fontWeight:600, marginBottom:'.45rem' }}>
            {(CHAPTER_FRAMEWORKS[chapterType] || {}).label || 'Chapter'} text
          </label>
          <textarea
            id="chapter-text"
            value={chapterText}
            onChange={function(e) { setChapterText(e.target.value); }}
            placeholder={'Paste your ' + ((CHAPTER_FRAMEWORKS[chapterType] || {}).label || 'chapter') + ' section here…'}
            disabled={chapterRunning}
            style={{ height:'200px' }}
          />
          <div className="word-count">{chapterText.trim().split(/\s+/).filter(Boolean).length} words</div>
          <button className="btn-primary" onClick={runChapter} disabled={!chapterText.trim() || chapterRunning} aria-busy={chapterRunning}>
            {chapterRunning ? <><span className="dots" aria-hidden="true"><span/><span/><span/></span> Evaluating…</> : 'Evaluate Chapter'}
          </button>
        </div>
      )}

      {/* ── Research Question mode ── */}
      {mode === 'research-q' && (
        <div>
          <label htmlFor="rq-text" style={{ display:'block', fontWeight:600, marginBottom:'.45rem' }}>Research Question</label>
          <textarea
            id="rq-text"
            value={rqText}
            onChange={function(e) { setRqText(e.target.value); }}
            placeholder="Paste your research question here…"
            disabled={rqRunning}
            style={{ height:'100px' }}
          />
          <div className="word-count">{rqText.trim().split(/\s+/).filter(Boolean).length} words</div>
          <div className="study-type-row" style={{ marginTop:'.75rem' }}>
            <span style={{ fontSize:'.8rem', color:'var(--muted)', marginRight:'.2rem' }}>Study type:</span>
            {['quantitative','qualitative','mixed','review','clinical'].map(function(t) {
              return (
                <button
                  key={t}
                  className={'filter-btn' + (studyType === t ? ' active' : '')}
                  onClick={function() { setStudyType(t); }}
                  type="button"
                >{t}</button>
              );
            })}
          </div>
          <button className="btn-primary" onClick={runResearchQ} disabled={!rqText.trim() || rqRunning} aria-busy={rqRunning}>
            {rqRunning ? <><span className="dots" aria-hidden="true"><span/><span/><span/></span> Evaluating…</> : 'Evaluate Research Question'}
          </button>
        </div>
      )}

      {/* ── Shared abstract textarea (title / journal / abstract / contribution / keywords) ── */}
      {(mode === 'title' || mode === 'journal' || mode === 'abstract' || mode === 'contribution' || mode === 'keywords') && (
        <div>
          <label htmlFor="abstract" style={{ display:'block', fontWeight:600, marginBottom:'.45rem' }}>Abstract</label>
          {wordCount > 0 && wordCount < 50 && (
            <div className="warn-box">⚠ Abstract may be too brief ({wordCount} words). Accuracy may vary.</div>
          )}
          <textarea
            id="abstract"
            value={abstract}
            onChange={e => setAbstract(e.target.value)}
            placeholder="Paste your academic abstract here…"
            disabled={running || journalRunning || abstractRunning || contribRunning || kwRunning}
            aria-describedby="wc"
          />
          <div id="wc" className={`word-count${wordCount > 0 && wordCount < 50 ? ' warn' : ''}`}>
            {wordCount} {wordCount === 1 ? 'word' : 'words'}
          </div>

          {mode === 'title' && (
            <button className="btn-primary" onClick={run} disabled={!canRun} aria-busy={running}>
              {running ? <><span className="dots" aria-hidden="true"><span/><span/><span/></span> Analysing…</> : 'Analyse & Generate Titles'}
            </button>
          )}

          {mode === 'journal' && (
            <>
              {/* Access filter */}
              <div className="filter-row" style={{ marginTop:'.9rem' }}>
                <span style={{ fontSize:'.8rem', color:'var(--muted)', marginRight:'.2rem' }}>Access:</span>
                {[
                  { key:'any',          lbl:'Any'          },
                  { key:'open-access',  lbl:'Open Access'  },
                  { key:'subscription', lbl:'Subscription' },
                  { key:'hybrid',       lbl:'Hybrid'       },
                ].map(function(opt) {
                  return (
                    <button key={opt.key}
                      className={'filter-btn' + (journalPrefs.access === opt.key ? ' active' : '')}
                      onClick={function() { setJPrefs(function(p) { return Object.assign({}, p, { access: opt.key }); }); }}
                      type="button"
                    >{opt.lbl}</button>
                  );
                })}
              </div>
              {/* h-index + OA mandate row */}
              <div className="hindex-row">
                <label htmlFor="hindex">h-index (optional):</label>
                <input
                  id="hindex"
                  className="hindex-input"
                  type="number"
                  min="0"
                  max="200"
                  value={journalPrefs.hindex}
                  onChange={function(e) { setJPrefs(function(p) { return Object.assign({}, p, { hindex: e.target.value }); }); }}
                  placeholder="e.g. 12"
                />
                <label style={{ display:'flex', alignItems:'center', gap:'.4rem', fontSize:'.8rem', color:'var(--muted)', cursor:'pointer', marginLeft:'.5rem' }}>
                  <input
                    type="checkbox"
                    checked={journalPrefs.oaMandate}
                    onChange={function(e) { setJPrefs(function(p) { return Object.assign({}, p, { oaMandate: e.target.checked }); }); }}
                    style={{ accentColor:'var(--accent)', width:'14px', height:'14px' }}
                  />
                  Funder requires Open Access
                </label>
              </div>
              <button className="btn-primary" onClick={runJournals} disabled={!abstract.trim() || journalRunning} aria-busy={journalRunning}>
                {journalRunning ? <><span className="dots" aria-hidden="true"><span/><span/><span/></span> Finding journals…</> : 'Find Matching Journals'}
              </button>
            </>
          )}

          {mode === 'abstract' && (
            <button className="btn-primary" onClick={runAbstract} disabled={!abstract.trim() || abstractRunning} aria-busy={abstractRunning}>
              {abstractRunning ? <><span className="dots" aria-hidden="true"><span/><span/><span/></span> Analysing…</> : 'Get Abstract Feedback'}
            </button>
          )}

          {mode === 'contribution' && (
            <button className="btn-primary" onClick={runContribution} disabled={!abstract.trim() || contribRunning} aria-busy={contribRunning}>
              {contribRunning ? <><span className="dots" aria-hidden="true"><span/><span/><span/></span> Analysing…</> : 'Check Contribution Claims'}
            </button>
          )}

          {mode === 'keywords' && (
            <>
              <label className="kw-textarea-label" htmlFor="kw-text">Your draft keywords <span style={{ fontWeight:400, color:'var(--muted)' }}>(comma or newline separated)</span></label>
              <textarea
                id="kw-text"
                value={keywordsText}
                onChange={function(e) { setKeywords(e.target.value); }}
                placeholder="e.g. deep learning, healthcare, medical imaging, neural network"
                disabled={kwRunning}
                style={{ height:'80px' }}
              />
              <button
                className="btn-primary"
                onClick={runKeywords}
                disabled={!abstract.trim() || !keywordsText.trim() || kwRunning}
                aria-busy={kwRunning}
              >
                {kwRunning ? <><span className="dots" aria-hidden="true"><span/><span/><span/></span> Analysing…</> : 'Optimize Keywords'}
              </button>
            </>
          )}
        </div>
      )}

      {/* ── Title mode results ── */}
      {mode === 'title' && Object.keys(s).length > 0 && <hr className="div" />}

      {mode === 'title' && s[1] && (
        <StepCard num={1} title="Field Detection" status={s[1].status}>
          {s[1].status === 'loading' && <Dots text="Identifying field and keywords…" />}
          {s[1].status === 'error'   && <div className="error-box">{s[1].error}</div>}
          {s[1].status === 'done'    && <FieldDisplay data={s[1].data} />}
        </StepCard>
      )}

      {mode === 'title' && s[2] && (
        <StepCard num={2} title="Literature Search" status={s[2].status}>
          {s[2].status === 'loading' && (
            <Dots text={s[2].msg || 'Searching Semantic Scholar for top cited papers…'} />
          )}
          {s[2].status === 'error' && <div className="error-box">{s[2].error}</div>}
          {s[2].status === 'done'  && (
            <LiteratureDisplay papers={s[2].data} relevantSet={relevantSet} />
          )}
        </StepCard>
      )}

      {mode === 'title' && s[3] && (
        <StepCard num={3} title="Citation Mining Report" status={s[3].status}>
          {s[3].status === 'loading' && <Dots text="Mining citation patterns…" />}
          {s[3].status === 'error'   && <div className="error-box">{s[3].error}</div>}
          {s[3].status === 'done'    && (
            <MiningDisplay data={s[3].data} relevance={s[3].relevance} papers={(s[2] && s[2].data) || []} />
          )}
        </StepCard>
      )}

      {mode === 'title' && s[4] && (
        <StepCard num={4} title="Abstract Decomposition" status={s[4].status}>
          {s[4].status === 'loading' && <Dots text="Decomposing your abstract…" />}
          {s[4].status === 'error'   && <div className="error-box">{s[4].error}</div>}
          {s[4].status === 'done'    && <DecompDisplay data={s[4].data} />}
        </StepCard>
      )}

      {mode === 'title' && s[5] && (
        <StepCard num={5} title="Title Recommendations" status={s[5].status}>
          {s[5].status === 'loading' && <Dots text="Generating and scoring titles…" />}
          {s[5].status === 'error'   && <div className="error-box">{s[5].error}</div>}
          {s[5].status === 'done'    && (s[5].data || []).map((item, i) => (
            <TitleCard key={i} item={item} isWinner={false} />
          ))}
        </StepCard>
      )}

      {mode === 'title' && s[6] && (
        <StepCard num={6} title="Winner Declaration" status={s[6].status}>
          {s[6].status === 'loading' && <Dots text="Selecting winner…" />}
          {s[6].status === 'error'   && <div className="error-box">{s[6].error}</div>}
          {s[6].status === 'done' && s[6].data && (
            <div className="winner-wrap">
              <div className="winner-banner">★ Recommended Title</div>
              <p className="winner-title">{s[6].data.title}</p>
              <p className="winner-just">{s[6].data.justification}</p>
              <div className="winner-foot">
                <CopyBtn text={s[6].data.title} />
              </div>
            </div>
          )}
        </StepCard>
      )}

      {/* ── Journal mode results ── */}
      {mode === 'journal' && journalSteps !== null && <hr className="div" />}

      {mode === 'journal' && journalSteps !== null && journalSteps.status === 'loading' && (
        <StepCard num={1} title="Finding Journals" status="loading">
          <Dots text={journalSteps.msg || 'Searching for matching journals…'} />
        </StepCard>
      )}
      {mode === 'journal' && journalSteps !== null && journalSteps.status === 'error' && (
        <StepCard num={1} title="Journal Search" status="error">
          <div className="error-box">{journalSteps.error}</div>
        </StepCard>
      )}
      {mode === 'journal' && journalSteps !== null && journalSteps.status === 'done' && (
        <StepCard num={1} title="Journal Recommendations" status="done">
          <div className="journal-list">
            {(journalSteps.data || []).map(function(j, i) {
              return <JournalCard key={i} item={j} rank={j.rank || i + 1} />;
            })}
          </div>
        </StepCard>
      )}

      {/* ── Abstract mode results ── */}
      {mode === 'abstract' && abstractResult !== null && <hr className="div" />}

      {mode === 'abstract' && abstractResult !== null && abstractResult.status === 'loading' && (
        <StepCard num={1} title="Abstract Analysis" status="loading">
          <Dots text="Scoring and improving your abstract…" />
        </StepCard>
      )}
      {mode === 'abstract' && abstractResult !== null && abstractResult.status === 'error' && (
        <StepCard num={1} title="Abstract Analysis" status="error">
          <div className="error-box">{abstractResult.error}</div>
        </StepCard>
      )}
      {mode === 'abstract' && abstractResult !== null && abstractResult.status === 'done' && (
        <StepCard num={1} title="Abstract Feedback" status="done">
          <AbstractResult data={abstractResult.data} />
        </StepCard>
      )}

      {/* ── Conclusion mode results ── */}
      {mode === 'conclusion' && conclusionResult !== null && <hr className="div" />}
      {mode === 'conclusion' && conclusionResult !== null && conclusionResult.status === 'loading' && (
        <StepCard num={1} title="Conclusion Analysis" status="loading"><Dots text="Evaluating your conclusion…" /></StepCard>
      )}
      {mode === 'conclusion' && conclusionResult !== null && conclusionResult.status === 'error' && (
        <StepCard num={1} title="Conclusion Analysis" status="error"><div className="error-box">{conclusionResult.error}</div></StepCard>
      )}
      {mode === 'conclusion' && conclusionResult !== null && conclusionResult.status === 'done' && (
        <StepCard num={1} title="Conclusion Feedback" status="done"><ConclusionResult data={conclusionResult.data} /></StepCard>
      )}

      {/* ── Chapter Review results ── */}
      {mode === 'chapter' && chapterResult !== null && <hr className="div" />}
      {mode === 'chapter' && chapterResult !== null && chapterResult.status === 'loading' && (
        <StepCard num={1} title="Chapter Evaluation" status="loading">
          <Dots text={'Evaluating your ' + ((CHAPTER_FRAMEWORKS[chapterType] || {}).label || 'chapter') + '…'} />
        </StepCard>
      )}
      {mode === 'chapter' && chapterResult !== null && chapterResult.status === 'error' && (
        <StepCard num={1} title="Chapter Evaluation" status="error"><div className="error-box">{chapterResult.error}</div></StepCard>
      )}
      {mode === 'chapter' && chapterResult !== null && chapterResult.status === 'done' && (
        <StepCard num={1} title={(CHAPTER_FRAMEWORKS[chapterResult.chapterType] || {}).label + ' — ' + (CHAPTER_FRAMEWORKS[chapterResult.chapterType] || {}).name + ' Feedback'} status="done">
          <ChapterResult data={chapterResult.data} chapterType={chapterResult.chapterType} />
        </StepCard>
      )}

      {/* ── Research Question results ── */}
      {mode === 'research-q' && rqResult !== null && <hr className="div" />}
      {mode === 'research-q' && rqResult !== null && rqResult.status === 'loading' && (
        <StepCard num={1} title="Research Question Evaluation" status="loading"><Dots text="Evaluating against FINER criteria…" /></StepCard>
      )}
      {mode === 'research-q' && rqResult !== null && rqResult.status === 'error' && (
        <StepCard num={1} title="Research Question Evaluation" status="error"><div className="error-box">{rqResult.error}</div></StepCard>
      )}
      {mode === 'research-q' && rqResult !== null && rqResult.status === 'done' && (
        <StepCard num={1} title="FINER Feedback" status="done"><ResearchQResult data={rqResult.data} /></StepCard>
      )}

      {/* ── Contribution Check results ── */}
      {mode === 'contribution' && contribResult !== null && <hr className="div" />}
      {mode === 'contribution' && contribResult !== null && contribResult.status === 'loading' && (
        <StepCard num={1} title="Contribution Analysis" status="loading"><Dots text="Identifying and evaluating novelty claims…" /></StepCard>
      )}
      {mode === 'contribution' && contribResult !== null && contribResult.status === 'error' && (
        <StepCard num={1} title="Contribution Analysis" status="error"><div className="error-box">{contribResult.error}</div></StepCard>
      )}
      {mode === 'contribution' && contribResult !== null && contribResult.status === 'done' && (
        <StepCard num={1} title="Contribution Clarity Report" status="done"><ContributionResult data={contribResult.data} /></StepCard>
      )}

      {/* ── Keywords Optimizer results ── */}
      {mode === 'keywords' && kwResult !== null && <hr className="div" />}
      {mode === 'keywords' && kwResult !== null && kwResult.status === 'loading' && (
        <StepCard num={1} title="Keywords Analysis" status="loading"><Dots text={kwResult.msg || 'Analysing keywords…'} /></StepCard>
      )}
      {mode === 'keywords' && kwResult !== null && kwResult.status === 'error' && (
        <StepCard num={1} title="Keywords Analysis" status="error"><div className="error-box">{kwResult.error}</div></StepCard>
      )}
      {mode === 'keywords' && kwResult !== null && kwResult.status === 'done' && (
        <StepCard num={1} title="Keywords Report" status="done"><KeywordsResult data={kwResult.data} /></StepCard>
      )}

      <div ref={endRef} />

      {/* ── Footer ── */}
      <footer className="footer">
        <p>
          Powered by{' '}
          <a href="https://www.semanticscholar.org" target="_blank" rel="noopener noreferrer">Semantic Scholar</a>
          {' '}+{' '}
          <span style={{ fontFamily:'var(--mono)', fontSize:'.75rem', color:'var(--muted)' }}>
            {(MODELS.find(function(m) { return m.id === selectedModel; }) || {}).label || selectedModel}
          </span>
        </p>
        {(Object.keys(s).length > 0 || journalSteps !== null || abstractResult !== null || conclusionResult !== null || chapterResult !== null || rqResult !== null || contribResult !== null || kwResult !== null) && (
          <button className="btn-ghost" onClick={reset}>↺ Start over</button>
        )}
      </footer>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
